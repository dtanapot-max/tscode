                      <button class="prop-field-btn ${i === selected ? 'active' : ''}" data-field-index="${i}" title="เลือกเพื่อแก้ไข Field">
                        ${i + 1}. ${escapeHTML(f.label || f.id || 'Field')} <span style="color:var(--text-muted);">(${escapeHTML(f.type || 'input')})</span>
                      </button>
                      <div class="prop-field-tools">
                        <button type="button" class="prop-field-tool" data-field-up="${i}" title="เลื่อนขึ้น" ${isPrimaryKey || i <= 1 ? 'disabled' : ''}>↑</button>
                        <button type="button" class="prop-field-tool" data-field-down="${i}" title="เลื่อนลง" ${isPrimaryKey || i >= fields.length - 1 ? 'disabled' : ''}>↓</button>
                        <button type="button" class="prop-field-tool danger" data-field-delete="${i}" title="ลบ Field" ${isPrimaryKey ? 'disabled' : ''}>×</button>
                      </div>
                    </div>
                  `;
                }).join('') || '<div style="font-size:.66rem;color:var(--text-muted);">ยังไม่มี field</div>'}
              </div>

              ${field ? `
                <div class="prop-control-row">
                  <label>Field ID</label>
                  <input type="text" id="prop-field-id" value="${escapeHTML(field.id || '')}" ${field.type === 'autoIncrement' || field.id === 'id' ? 'readonly' : ''} />
                </div>

                <div class="prop-control-row">
                  <label>Label</label>
                  <input type="text" id="prop-field-label" value="${escapeHTML(field.label || '')}" />
                </div>

                <div class="prop-control-row">
                  <label>Type</label>
                  <select id="prop-field-type" ${field.type === 'autoIncrement' || field.id === 'id' ? 'disabled' : ''}>
                    <option value="text" ${field.type === 'input' && (field.inputType || 'text') === 'text' ? 'selected' : ''}>Text</option>
                    <option value="number" ${field.type === 'input' && field.inputType === 'number' ? 'selected' : ''}>Number</option>
                    <option value="date" ${field.type === 'input' && field.inputType === 'date' ? 'selected' : ''}>Date</option>
                    <option value="password" ${field.type === 'input' && field.inputType === 'password' ? 'selected' : ''}>Password</option>
                    <option value="textarea" ${field.type === 'textarea' ? 'selected' : ''}>Textarea</option>
                    <option value="select" ${field.type === 'select' ? 'selected' : ''}>Select</option>
                    <option value="checkbox" ${field.type === 'checkbox' ? 'selected' : ''}>Checkbox</option>
                    <option value="file" ${field.type === 'file' ? 'selected' : ''}>File</option>
                    ${field.type === 'autoIncrement' || field.id === 'id' ? '<option value="autoIncrement" selected>Auto Increment</option>' : ''}
                  </select>
                </div>

                ${field.type !== 'file' ? `
                  <div class="prop-control-row">
                    <label>Placeholder</label>
                    <input type="text" id="prop-field-placeholder" value="${escapeHTML(field.placeholder || '')}" />
                  </div>
                ` : `
                  <div class="prop-control-row">
                    <label>Accept</label>
                    <input type="text" id="prop-field-accept" value="${escapeHTML(field.accept || '*/*')}" placeholder="*/*, image/*, video/*" />
                  </div>
                `}

                <div class="prop-control-row">
                  <label>Required</label>
                  <select id="prop-field-required">
                    <option value="false" ${field.required ? '' : 'selected'}>false</option>
                    <option value="true" ${field.required ? 'selected' : ''}>true</option>
                  </select>
                </div>

                ${field.type === 'select' ? `
                  <div class="prop-control-row">
                    <label>Options</label>
                    <input type="text" id="prop-field-options" value="${escapeHTML((field.options || []).join(', '))}" title="คั่นด้วย comma" />
                  </div>
                ` : ''}
              ` : ''}
            </div>
          `;

          const updateScreen = () => this.updateJSONFormSchema(next => {
            next.screen ||= {};
            next.screen.title = $('#prop-screen-title', this.dom.propContent)?.value || '';
            next.screen.description = $('#prop-screen-desc', this.dom.propContent)?.value || '';
            next.screen.submitLabel = $('#prop-submit-label', this.dom.propContent)?.value || '';
          }, 'screen-edit');

          $('#prop-screen-title', this.dom.propContent)?.addEventListener('input', updateScreen);
          $('#prop-screen-desc', this.dom.propContent)?.addEventListener('input', updateScreen);
          $('#prop-submit-label', this.dom.propContent)?.addEventListener('input', updateScreen);

          $$('[data-field-index]', this.dom.propContent).forEach(btn => {
            btn.addEventListener('click', () => {
              this.selectedFormFields.set(active.id, +btn.dataset.fieldIndex);
              this.renderJSONFormProperties(active);
            });
          });

          $$('[data-field-up]', this.dom.propContent).forEach(btn => {
            btn.addEventListener('click', () => this.moveJSONFormField(active, +btn.dataset.fieldUp, -1));
          });

          $$('[data-field-down]', this.dom.propContent).forEach(btn => {
            btn.addEventListener('click', () => this.moveJSONFormField(active, +btn.dataset.fieldDown, 1));
          });

          $$('[data-field-delete]', this.dom.propContent).forEach(btn => {
            btn.addEventListener('click', () => this.deleteJSONFormField(active, +btn.dataset.fieldDelete));
          });

          $('#prop-add-text', this.dom.propContent)?.addEventListener('click', () => this.addJSONFormField(active, 'text'));
          $('#prop-add-number', this.dom.propContent)?.addEventListener('click', () => this.addJSONFormField(active, 'number'));
          $('#prop-add-date', this.dom.propContent)?.addEventListener('click', () => this.addJSONFormField(active, 'date'));
          $('#prop-add-password', this.dom.propContent)?.addEventListener('click', () => this.addJSONFormField(active, 'password'));
          $('#prop-add-textarea', this.dom.propContent)?.addEventListener('click', () => this.addJSONFormField(active, 'textarea'));
          $('#prop-add-select', this.dom.propContent)?.addEventListener('click', () => this.addJSONFormField(active, 'select'));
          $('#prop-add-checkbox', this.dom.propContent)?.addEventListener('click', () => this.addJSONFormField(active, 'checkbox'));
          $('#prop-add-file', this.dom.propContent)?.addEventListener('click', () => this.addJSONFormField(active, 'file'));

          const updateField = async (syncImmediate = false) => {
            const index = this.selectedFormFields.get(active.id) ?? 0;
            const retiredFiles = [];
            const saved = await this.updateJSONFormSchema(next => {
              const target = next.fields?.[index];
              if (!target) return;

              const isPrimaryKey = target.type === 'autoIncrement' || target.id === 'id';
              const oldId = target.id;
              const previousType = target.type;
              const previousInputType = target.inputType || null;
              const requestedId = $('#prop-field-id', this.dom.propContent)?.value.trim() || oldId;
              const newId = isPrimaryKey ? 'id' : (requestedId === 'id' ? `${requestedId}_field` : requestedId);

              target.id = newId;
              target.label = $('#prop-field-label', this.dom.propContent)?.value || '';
              if (target.type !== 'file') target.placeholder = $('#prop-field-placeholder', this.dom.propContent)?.value || '';
              target.required = isPrimaryKey ? true : $('#prop-field-required', this.dom.propContent)?.value === 'true';

              if (isPrimaryKey) {
                target.type = 'autoIncrement';
                delete target.inputType;
              } else {
                const editorType = $('#prop-field-type', this.dom.propContent)?.value || 'text';
                if (editorType === 'text' || editorType === 'number' || editorType === 'date' || editorType === 'password') {
                  target.type = 'input';
                  target.inputType = editorType;
                  delete target.options;
                  delete target.accept;
                } else {
                  target.type = editorType;
                  delete target.inputType;
                  if (editorType === 'textarea' && !target.rows) target.rows = 5;
                  if (editorType === 'select' && !Array.isArray(target.options)) target.options = ['Option A', 'Option B'];
                  if (editorType === 'file') {
                    target.accept = $('#prop-field-accept', this.dom.propContent)?.value || target.accept || '*/*';
                    delete target.placeholder;
                  } else {
                    delete target.accept;
                  }
                  if (editorType !== 'select') delete target.options;
                }
              }

              if (target.type === 'select') {
                target.options = ($('#prop-field-options', this.dom.propContent)?.value || (target.options || []).join(', '))
                  .split(',')
                  .map(v => v.trim())
                  .filter(Boolean);
              }

              if (newId !== oldId && Array.isArray(next.data)) {
                next.data.forEach(row => {
                  if (row && Object.hasOwn(row, oldId)) {
                    row[newId] = row[oldId];
                    delete row[oldId];
                  }
                });
              }

              const previousShape = { type: previousType, inputType: previousInputType };
              if (!JSONFormModel.sameStorageType(previousShape, target) && Array.isArray(next.data)) {
                next.data.forEach(row => {
                  if (!row || typeof row !== 'object') return;
                  const current = row[newId];
                  if (previousType === 'file' && current?.path) retiredFiles.push(current);
                  row[newId] = JSONFormModel.defaultValue(target);
                });
              }
            }, 'field-edit', syncImmediate);

            if (saved && retiredFiles.length) {
              await fileAssets.removeMany(retiredFiles, 'field-type-conversion');
            }
            return saved;
          };

          $('#prop-field-id', this.dom.propContent)?.addEventListener('change', updateField);
          $('#prop-field-label', this.dom.propContent)?.addEventListener('input', updateField);
          $('#prop-field-type', this.dom.propContent)?.addEventListener('change', async () => {
            const saved = await updateField(true);
            if (saved) this.renderJSONFormProperties(active);
          });
          $('#prop-field-placeholder', this.dom.propContent)?.addEventListener('input', updateField);
          $('#prop-field-accept', this.dom.propContent)?.addEventListener('input', updateField);
          $('#prop-field-required', this.dom.propContent)?.addEventListener('change', updateField);
          $('#prop-field-options', this.dom.propContent)?.addEventListener('change', updateField);
        }

        moveJSONFormField(active, index, direction) {
          const { schema, error } = this.parseJSONForm(active);
          if (error || !schema) return;

          const fields = schema.fields || [];
          const field = fields[index];
          if (!field || field.type === 'autoIncrement' || field.id === 'id') return;

          const targetIndex = index + direction;
          if (targetIndex < 1 || targetIndex >= fields.length) return;

          this.updateJSONFormSchema(next => {
            const list = next.fields || [];
            [list[index], list[targetIndex]] = [list[targetIndex], list[index]];
          });

          this.selectedFormFields.set(active.id, targetIndex);
          this.renderJSONFormProperties(active);
        }

        async deleteJSONFormField(active, index) {
          const { schema, error } = this.parseJSONForm(active);
          if (error || !schema) return;

          const field = schema.fields?.[index];
          if (!field || field.type === 'autoIncrement' || field.id === 'id') return;
          if (!confirm(`ยืนยันการลบ Field "${field.label || field.id}" หรือไม่?
ข้อมูล "${field.id}" จะถูกลบออกจากทุก record`)) return;

          const removedFiles = field.type === 'file'
            ? (schema.data || []).map(row => row?.[field.id]).filter(value => value?.path)
            : [];
          schema.fields.splice(index, 1);
          (schema.data || []).forEach(row => {
            if (row && typeof row === 'object') delete row[field.id];
          });
          const saved = await this.persistJSONForm(active, schema, 'field-delete');
          if (!saved) return;
          await fileAssets.removeMany(removedFiles, 'field-delete');

          const remainingCount = Math.max(1, schema.fields?.length || 1);
          const nextIndex = remainingCount > 1 ? Math.max(1, Math.min(index, remainingCount - 1)) : 0;
          this.selectedFormFields.set(active.id, nextIndex);
          this.renderJSONFormProperties(active);
          this.renderJSONFormStage(active, true);
        }

        addJSONFormField(active, type) {
          this.updateJSONFormSchema(schema => {
            schema.fields ||= [];
            schema.data = Array.isArray(schema.data) ? schema.data : [];
            let i = schema.fields.length + 1;
            const ids = new Set(schema.fields.map(f => f.id));
            let id = type === 'password' && !ids.has('password') ? 'password' : `field_${i}`;
            while (ids.has(id) || id === 'id') id = `field_${++i}`;

            const templates = {
              text: { id, label: `Text ${i}`, type: 'input', inputType: 'text', placeholder: '', required: false },
              number: { id, label: `Number ${i}`, type: 'input', inputType: 'number', placeholder: '', required: false },
              date: { id, label: `Date ${i}`, type: 'input', inputType: 'date', placeholder: '', required: false },
              password: { id, label: id === 'password' ? 'รหัสผ่าน' : `Password ${i}`, type: 'input', inputType: 'password', placeholder: 'กรอกรหัสผ่าน', required: id === 'password' },
              textarea: { id, label: `Textarea ${i}`, type: 'textarea', placeholder: '', rows: 5, required: false },
              select: { id, label: `Select ${i}`, type: 'select', options: ['Option A', 'Option B'], required: false },
              checkbox: { id, label: `Checkbox ${i}`, type: 'checkbox', required: false },
              file: { id, label: `File ${i}`, type: 'file', accept: '*/*', required: false }
            };

            const field = templates[type] || templates.text;
            schema.fields.push(field);
            const defaultValue = JSONFormModel.defaultValue(field);
            schema.data.forEach(row => {
              if (row && typeof row === 'object' && !Object.hasOwn(row, id)) row[id] = defaultValue;
            });
            this.selectedFormFields.set(active.id, schema.fields.length - 1);
          });
          this.renderJSONFormProperties(active);
        }

      }

      /* --- [5] BOOTSTRAP WORKSPACE --- */
      window.Logger?.init({ open: false, persist: true });
      window.Logger?.setMode(navigator.onLine ? 'online' : 'offline');

      new WorkspaceUI($('#root'));
    })();
  </script>
</body>
</html>
