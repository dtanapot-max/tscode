<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TS Code - Production Vanilla JS Workspace</title>
  <style id="app-style">
    :root {
      --bg: #1e1e1e;
      --surface: #252526;
      --surface-elevated: #2d2d2d;
      --border: #374151;
      --text: #cccccc;
      --text-bright: #ffffff;
      --text-muted: #858585;
      --accent: #007acc;
      --accent-hover: #1f8ad2;
      --danger: #f14c4c;
      --success: #89d185;
      --radius: 3px;
      --topbar-h: 28px;
      --log-space: 0px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    html, body {
      background-color: var(--bg);
      color: var(--text);
      height: 100%;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: fixed;
    }
    #root {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      height: calc(100% - var(--log-space, 0px));
      position: relative;
      overflow: hidden;
    }
    .c3-topbar {
      height: var(--topbar-h);
      min-height: var(--topbar-h);
      background: #181818;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      flex-shrink: 0;
      z-index: 50;
    }
    .c3-topbar-left, .c3-topbar-right { display: flex; align-items: center; gap: 8px; }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 800;
      height: 20px;
      padding: 0 6px;
      border-radius: var(--radius);
      font-size: 0.74rem;
      user-select: none;
    }
    .chapter-select {
      background: var(--surface);
      color: var(--text-bright);
      border: 1px solid var(--border);
      height: 22px;
      padding: 0 6px;
      border-radius: var(--radius);
      font-size: 0.74rem;
      outline: none;
      max-width: 240px;
      cursor: pointer;
    }
    .layout-control-group { display: inline-flex; align-items: center; gap: 4px; }
    .layout-toggle-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      height: 20px;
      padding: 0 6px;
      font-size: 0.85rem;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .layout-toggle-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-bright); }
    .layout-toggle-btn.active { color: var(--accent); background: rgba(0, 122, 204, 0.15); border-color: rgba(0, 122, 204, 0.4); }
    
    .bundle-btn {
      background: #238636;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      height: 20px;
      padding: 0 8px;
      font-size: 0.70rem;
      font-weight: 700;
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .bundle-btn:hover { background: #2ea043; }

    .c3-shell {
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      height: calc(100% - var(--topbar-h));
      position: relative;
      overflow: hidden;
    }
    .c3-dock {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 30;
      flex-shrink: 0;
    }
    .c3-dock-left { border-right: 1px solid var(--border); }
    .c3-dock-right { border-left: 1px solid var(--border); }

    .dock-header {
      height: 24px;
      min-height: 24px;
      padding: 0 7px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #181818;
      font-size: 0.64rem;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .dock-title-group { letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
    .dock-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 2px;
      font-size: 0.80rem;
    }
    .dock-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .modal-close-btn { min-width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 1.05rem; }

    .c3-splitter {
      width: 4px;
      background: var(--border);
      cursor: col-resize;
      flex-shrink: 0;
      user-select: none;
      z-index: 35;
    }
    .c3-splitter:hover, .c3-splitter.is-dragging { background: var(--accent); }
    .dock-content { flex: 1 1 auto; overflow-y: auto; padding: 6px; }

    .c3-stage {
      flex: 1 1 auto;
      min-width: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .editor-tab-strip {
      height: 26px;
      background: #252526;
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .editor-tab-strip::-webkit-scrollbar { display: none; }
    .editor-tab {
      height: 26px;
      padding: 0 4px 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      background: #2d2d2d;
      border-right: 1px solid rgba(0, 0, 0, 0.25);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    .editor-tab:hover { background: #323233; color: var(--text-bright); }
    .editor-tab.active { background: #1e1e1e; color: var(--text-bright); border-top: 2px solid var(--accent); }
    .tab-close-btn {
      background: transparent;
      border: none;
      font-size: 0.85rem;
      padding: 0 4px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .tab-close-btn:hover { background: rgba(255, 255, 255, 0.2); color: #ffffff; }

    .stage-editor-box {
      flex: 1 1 auto;
      overflow: hidden;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .stage-action-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .stage-action-bar-left { flex: 1 1 200px; min-width: 0; max-width: 320px; display: flex; flex-direction: column; gap: 3px; }
    .stage-action-bar-left > input[type="text"] { height: 30px; padding: 4px 9px; font-size: 0.78rem; }
    .stage-action-bar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; align-self: flex-end; }
    .stage-action-bar-right .btn {
      height: 30px;
      padding: 0 10px;
      font-size: 0.72rem;
      white-space: nowrap;
      flex-shrink: 0;
      justify-content: center;
      line-height: 1;
    }

    .workspace-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px; margin-bottom: 6px; }
    .workspace-actions .btn { justify-content: center; height: 24px; padding: 3px 6px; font-size: 0.68rem; }
    .workspace-template-select { min-width: 0; height: 24px; padding: 2px 5px; font-size: 0.66rem; background: var(--surface-elevated); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); outline: none; }
    .workspace-template-select:focus { border-color: var(--accent); }

    .content-tab-bar {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .content-tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 12px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .content-tab-btn:hover { color: var(--text-bright); background: rgba(255,255,255,0.04); }
    .content-tab-btn.active { color: var(--text-bright); border-bottom-color: var(--accent); }

    /* JSON Form: one-frame compact layout; labels stay left, controls stay right */
    .stage-editor-box[data-kind="json-form"] {
      padding: 8px 10px;
      gap: 7px;
    }
    .json-form-screen {
      --json-label-w: 86px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      padding: 2px 2px 5px;
      border: 0;
      background: transparent;
    }
    .json-form-card {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 10px 12px 9px;
      background: #202020;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .json-form-title { color: var(--text-bright); font-size: 0.90rem; margin-bottom: 1px; }
    .json-form-desc { color: var(--text-muted); font-size: 0.68rem; margin-bottom: 7px; }
    .json-form-field {
      display: grid;
      grid-template-columns: var(--json-label-w, 86px) minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      margin-bottom: 5px;
      min-width: 0;
    }
    .json-form-field > label {
      margin: 0;
      min-width: 0;
      font-size: 0.66rem;
      line-height: 1.2;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text-muted);
    }
    .json-form-field input, .json-form-field textarea, .json-form-field select, .prop-editor input, .prop-editor select {
      width: 100%;
      min-width: 0;
      background: #2d2d2d;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-bright);
      padding: 4px 8px;
      font-size: 0.75rem;
      outline: none;
    }
    .json-form-field input, .json-form-field select { height: 29px; }
    .json-form-field input[type="file"] { height: auto; min-height: 29px; padding: 3px 6px; font-size: .69rem; }
    .json-form-field textarea { min-height: 58px; max-height: 160px; resize: vertical; font-family: inherit; line-height: 1.35; }
    .json-file-control { min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .json-file-control input[type="file"] { flex: 1 1 180px; min-width: 0; }
    .json-file-current { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .66rem; color: var(--text-muted); }
    .json-form-field input:focus, .json-form-field textarea:focus, .json-form-field select:focus, .prop-editor input:focus, .prop-editor select:focus { border-color: var(--accent); }
    .json-form-checkbox-control { height: 29px; display: flex; align-items: center; }
    .json-form-checkbox-control input { width: 15px; height: 15px; margin: 0; }
    .json-form-actions { margin-left: calc(var(--json-label-w, 86px) + 7px); padding-top: 1px; }
    .json-form-actions .btn { height: 27px; padding: 0 9px; font-size: 0.69rem; }
    .json-output-box { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    .json-output-box pre { margin-top: 6px; padding: 10px; background: #181818; border: 1px solid var(--border); color: #89d185; font: 0.75rem/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
    .db-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 13px;
      margin: 0 0 7px;
      padding: 4px 0 6px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.07);
      border-radius: 0;
      color: var(--text-muted);
      font-size: .67rem;
    }
    .db-meta-row b { color: var(--text-bright); }
    .form-save-status { min-height: 14px; margin: 4px 0 0 calc(var(--json-label-w, 86px) + 7px); color: var(--success); font-size: .67rem; }
    .json-form-static-row {
      display: grid;
      grid-template-columns: var(--json-label-w, 86px) minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      min-height: 26px;
      padding-bottom: 5px;
      margin-bottom: 5px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: .68rem;
    }
    .json-form-static-key { color: var(--text-muted); }
    .json-form-static-val { color: var(--text-bright); font-family: ui-monospace, Consolas, monospace; }
    @media (max-width: 620px) {
      .json-form-screen, .row-edit-body { --json-label-w: 74px; }
      .json-form-field, .json-form-static-row { grid-template-columns: 74px minmax(0, 1fr); gap: 6px; }
      .json-form-actions { margin-left: 80px; }
      .form-save-status { margin-left: 80px; }
    }
    .json-output-tab textarea { flex: 1 1 auto; min-height: 0; color: var(--success); }
    .json-output-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .json-output-toolbar-left, .json-output-toolbar-right { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .json-output-toolbar .btn { height: 26px; padding: 0 8px; font-size: 0.68rem; white-space: nowrap; }
    .json-page-info { color: var(--text-muted); font-size: 0.68rem; white-space: nowrap; }
    .json-page-btn { min-width: 28px; justify-content: center; }
    .json-invalid { padding: 12px; border: 1px solid rgba(241,76,76,.4); background: rgba(241,76,76,.08); color: var(--danger); font-size: 0.76rem; }

    .rows-tab { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .rows-table-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; border: 1px solid var(--border); background: #1e1e1e; }
    .rows-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; white-space: nowrap; }
    .rows-table th, .rows-table td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.06); border-right: 1px solid rgba(255,255,255,.04); text-align: left; vertical-align: middle; }
    .rows-table th { position: sticky; top: 0; z-index: 2; background: #252526; color: var(--text-muted); font-size: 0.70rem; text-transform: uppercase; }
    .rows-table tbody tr:hover { background: rgba(255,255,255,.035); }
    .rows-table .row-id { font-family: ui-monospace, Consolas, monospace; color: var(--text-bright); }
    .rows-table .row-null { color: var(--text-muted); font-style: italic; }
    .rows-table .row-actions { position: sticky; right: 0; background: #1e1e1e; min-width: 116px; }
    .rows-table tr:hover .row-actions { background: #292929; }
    .rows-table th.row-actions { z-index: 3; background: #252526; }
    .rows-action-group { display: inline-flex; gap: 4px; }
    .rows-action-btn { height: 26px; padding: 0 8px; font-size: 0.70rem; }
    .row-file-actions { display: inline-flex; align-items: center; gap: 4px; max-width: 220px; }
    .row-file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
    .row-file-btn { height: 22px; padding: 0 6px; font-size: .65rem; }
    .row-edit-modal { width: 620px; max-width: 100%; max-height: min(82vh, 620px); background: #252526; border: 1px solid #454545; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.7); }
    .row-edit-body { --json-label-w: 86px; flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; scrollbar-width: thin; padding: 9px 12px; display: flex; flex-direction: column; gap: 0; }
    .row-edit-body .json-form-field { margin-bottom: 5px; }

    .prop-editor { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .prop-control-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 6px;
      align-items: center;
      min-width: 0;
    }
    .prop-control-row label {
      margin: 0;
      font-size: 0.61rem;
      line-height: 1.15;
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
    }
    .prop-control-row input,
    .prop-control-row select {
      width: 100%;
      min-width: 0;
      height: 28px;
      padding: 3px 7px;
      font-size: 0.74rem;
    }
    .prop-section-title {
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 0.61rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .c3-dock-right .prop-row { padding: 4px 0; font-size: 0.68rem; }
    .prop-actions { display: flex; gap: 4px; margin-top: 2px; }
    .prop-actions .btn { flex: 1; justify-content: center; padding: 2px 5px; height: 24px; font-size: 0.64rem; }
    .prop-actions-wrap { flex-wrap: wrap; }
    .prop-actions-wrap .btn { flex: 1 1 calc(50% - 4px); }
    .prop-field-list { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
    .prop-field-row { display: flex; align-items: center; gap: 3px; margin-bottom: 2px; }
    .prop-field-btn { flex: 1 1 auto; min-width: 0; text-align: left; background: #2d2d2d; color: var(--text); border: 1px solid transparent; padding: 4px 6px; border-radius: 3px; cursor: pointer; font-size: 0.66rem; }
    .prop-field-btn:hover, .prop-field-btn.active { border-color: var(--accent); background: rgba(0,122,204,.15); }
    .prop-field-tools { display: inline-flex; gap: 2px; flex-shrink: 0; }
    .prop-field-tool { height: 23px; min-width: 24px; padding: 0 4px; border: 1px solid var(--border); border-radius: 3px; background: #2d2d2d; color: var(--text-muted); cursor: pointer; font-size: 0.64rem; }
    .prop-field-tool:hover:not(:disabled) { color: var(--text-bright); border-color: var(--accent); }
    .prop-field-tool.danger:hover:not(:disabled) { color: #fff; background: var(--danger); border-color: var(--danger); }
    .prop-field-tool:disabled { opacity: .28; cursor: not-allowed; }

    .stage-empty-box { margin: auto; text-align: center; color: var(--text-muted); padding: 30px; }
    .stage-empty-title { font-size: 0.95rem; color: var(--text-bright); margin-bottom: 6px; }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.68rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    input[type="text"], textarea {
      background: #2d2d2d;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-bright);
      padding: 6px 10px;
      font-size: 0.82rem;
      outline: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
    textarea { flex: 1 1 auto; height: 100%; min-height: 0; font-family: ui-monospace, Consolas, monospace; line-height: 1.5; resize: none; }

    .btn {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      font-size: 0.74rem;
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      height: 28px;
    }
    .btn:hover { background: #37373d; }
    .btn.primary { background: var(--accent); color: #ffffff; border: none; }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.danger { background: rgba(241, 76, 76, 0.15); color: var(--danger); border-color: rgba(241, 76, 76, 0.3); }
    .btn.danger:hover { background: var(--danger); color: #ffffff; }

    .card-item {
      padding: 6px 8px;
      background: var(--surface-elevated);
      border: 1px solid transparent;
      border-radius: var(--radius);
      margin-bottom: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-item:hover { border-color: var(--border); }
    .card-item.active { border-color: var(--accent); background: rgba(0, 122, 204, 0.2); }
    .card-title { font-weight: 600; font-size: 0.78rem; color: var(--text-bright); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .card-del-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 4px; }
    .card-del-btn:hover { color: var(--danger); }

    .prop-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.72rem; }
    .prop-key { color: var(--text-muted); }
    .prop-val { font-weight: 600; font-family: monospace; color: var(--text-bright); }

    /* Deploy Modal Window */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(2px);
      z-index: 50000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .modal-box {
      background: #252526;
      border: 1px solid #454545;
      border-radius: 6px;
      width: 900px;
      max-width: 100%;
      height: 85vh;
      max-height: 640px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    }
    .modal-header {
      height: 38px;
      background: #1e1e1e;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
    }
    .modal-tabs {
      display: flex;
      gap: 5px;
      background: #181818;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
    }

  <!-- [A] OBSERVABILITY DIAGNOSTIC ENGINE -->
  <script id="logger-source">
    (function (global) {
      'use strict';
      const levels = { error: 'ERR', warn: 'WARN', info: 'INFO', success: 'SUCC', debug: 'DBG' };
      const defaults = { max: 250, height: 180, open: false, persist: true, key: 'ts_logger_dock_state_v8' };
      let options = { ...defaults };
      let entries = [];
      let active = 'all';
      let opened = false;
      let height = 180;
      let ui = null;
      let frame = 0, saveTimer = 0;

      function json(val, ind) {
        try { return JSON.stringify(val, null, ind) ?? 'null'; } catch (_) { return '"[Unserializable]"'; }
      }
      function limit(val, fb, min, max) {
        return typeof val === 'number' && Number.isFinite(val) ? Math.round(Math.min(max, Math.max(min, val))) : fb;
      }
      function node(tag, cls, content) {
        const el = document.createElement(tag);
        if (cls) el.className = cls;
        if (content !== undefined) el.textContent = content;
        return el;
      }
      function button(label, title) {
        const el = node('button', 'log-btn', label);
        el.type = 'button';
        el.title = title;
        return el;
      }
      function syncSpace() {
        if (!ui) return;
        const size = `${Math.ceil(ui.dock.getBoundingClientRect().height)}px`;
        ui.space.style.height = size;
        document.documentElement.style.setProperty('--log-space', size);
      }
      function maxHeight() {
        const vh = global.visualViewport ? global.visualViewport.height : global.innerHeight;
        return Math.max(0, Math.floor(vh * 0.7 - 24));
      }
      function restoreState() {
        if (!options.persist) return;
        try {
          const saved = JSON.parse(localStorage.getItem(options.key));
          if (!saved) return;
          if (typeof saved.open === 'boolean') opened = saved.open;
          if (typeof saved.height === 'number') height = limit(saved.height, height, 50, 1200);
        } catch (_) {}
      }
      function saveSoon() {
        if (!options.persist) return;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          try { localStorage.setItem(options.key, json({ open: opened, height })); } catch (_) {}
        }, 150);
      }
      function layout() {
        if (!ui) return;
        const max = maxHeight();
        height = Math.min(max, Math.max(Math.min(50, max), height));
        ui.body.hidden = !opened;
        ui.body.style.height = `${height}px`;
        ui.toggle.textContent = opened ? '[ย่อ]' : '[ขยาย]';
        syncSpace();
        saveSoon();
      }
      function row(entry) {
        const el = node('div', 'log-entry');
        el.dataset.level = entry.level;
        const time = node('time', 'log-time', entry.time);
        el.append(time, node('span', 'log-level', levels[entry.level]), node('span', 'log-cat', entry.category), node('span', 'log-msg', entry.message));
        if (entry.meta) el.append(node('code', 'log-meta', json(entry.meta)));
        return el;
      }
      function render() {
        cancelAnimationFrame(frame);
        frame = 0;
        if (!ui) return;
        const follow = ui.body.scrollHeight - ui.body.scrollTop - ui.body.clientHeight < 32;
        const oldTop = ui.body.scrollTop;
        const counts = { all: entries.length, error: 0, warn: 0, info: 0, success: 0, debug: 0 };
        const fragment = document.createDocumentFragment();

        for (const entry of entries) {
          counts[entry.level]++;
          if (active === 'all' || active === entry.level) fragment.append(row(entry));
        }
        ui.stream.replaceChildren(fragment);
        for (const [level, control] of Object.entries(ui.filters)) {
          control.count.textContent = counts[level];
          control.btn.setAttribute('aria-pressed', String(active === level));
        }
        ui.body.scrollTop = follow ? ui.body.scrollHeight : oldTop;
      }
      function log(category, level, message, meta = null) {
        level = String(level).toLowerCase();
        if (!Object.hasOwn(levels, level)) level = 'info';
        entries.push({
          time: new Date().toLocaleTimeString('en-GB', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          category: String(category).trim().toUpperCase() || 'STAGE',
          level,
          message: String(message),
          meta
        });
        if (entries.length > options.max) entries.shift();
        if (level === 'error' && !opened && ui) toggle(true);
        if (ui && !frame) frame = requestAnimationFrame(render);
      }
      function toggle(value) {
        opened = typeof value === 'boolean' ? value : !opened;
        layout();
        if (ui && opened) ui.body.scrollTop = ui.body.scrollHeight;
      }
      function resize() {
        let drag = null;
        ui.handle.addEventListener('pointerdown', e => {
          if (!e.isPrimary || e.button !== 0) return;
          e.preventDefault();
          const max = maxHeight();
          const pointerH = (window.innerHeight - e.clientY) - ui.bar.offsetHeight;
          if (!opened) {
            opened = true;
            height = limit(pointerH, height, 50, max);
            layout();
          }
          drag = { startY: e.clientY, startH: ui.body.getBoundingClientRect().height || height, id: e.pointerId };
          ui.handle.setPointerCapture?.(e.pointerId);
          ui.dock.classList.add('is-resizing');
        });
        ui.handle.addEventListener('pointermove', e => {
          if (!drag || drag.id !== e.pointerId) return;
          height = Math.min(maxHeight(), Math.max(50, Math.round(drag.startH + (drag.startY - e.clientY))));
          layout();
        });
        const finish = (e) => {
          if (!drag || drag.id !== e.pointerId) return;
          drag = null;
          ui.dock.classList.remove('is-resizing');
          saveSoon();
        };
        ui.handle.addEventListener('pointerup', finish);
        ui.handle.addEventListener('pointercancel', finish);
      }
      function init(config = {}) {
        if (ui || !document.body) return api;
        options = { ...defaults, ...config };
        restoreState();

        const dock = node('aside', 'log-dock');
        const handle = node('div', 'log-handle');
        const bar = node('div', 'log-bar');
        const dot = node('span', 'log-dot');
        const filters = node('div', 'log-filters');
        const controls = {};

        for (const [level, label] of Object.entries({ all: 'ALL', ...levels })) {
          const btn = button(`${label} `, `Filter ${label}`);
          btn.dataset.level = level;
          const count = node('span', 'log-count', '0');
          btn.append(count);
          filters.append(btn);
          controls[level] = { btn, count };
          btn.addEventListener('click', () => { active = level; render(); });
        }

        const actions = node('div', 'log-actions');
        const copyBtn = button('⧉ AI Output', 'Copy logs for AI analysis');
        copyBtn.classList.add('log-copy-btn');
        const clearBtn = button('ล้าง', 'Clear logs');
        const toggleBtn = button('[ขยาย]', 'Toggle drawer');
        actions.append(copyBtn, clearBtn, toggleBtn);
        bar.append(dot, filters, actions);

        const body = node('div', 'log-body');
        const stream = node('div', 'log-stream');
        body.append(stream);
        dock.append(handle, bar, body);
        const space = node('div', 'log-space');

        ui = { dock, handle, bar, dot, filters: controls, body, stream, copyBtn, space, toggle: toggleBtn };
        document.body.append(space, dock);

        toggleBtn.addEventListener('click', () => toggle());
        clearBtn.addEventListener('click', () => { entries = []; render(); });
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(JSON.stringify(entries, null, 2));
            copyBtn.textContent = 'Copied';
            setTimeout(() => { if (copyBtn) copyBtn.textContent = '⧉ AI Output'; }, 1500);
          } catch (_) {}
        });

        global.addEventListener('resize', layout);
        resize();
        layout();
        render();
        return api;
      }

      const api = { init, log, toggle, setMode: (m) => { if (ui) ui.dot.dataset.mode = m; } };
      for (const level of Object.keys(levels)) {
        api[level] = (cat, msg, meta) => log(cat, level, msg, meta);
      }
      global.Logger = Object.freeze(api);
    })(window);

    window.onerror = function (msg, src, lin, col, err) {
      window.Logger?.log('FATAL-ERROR', 'error', `${msg} [${src ? src.split('/').pop() : 'inline'}:${lin}:${col}]`, { stack: err?.stack });
      return false;
    };
    window.onunhandledrejection = function (e) {
      window.Logger?.log('UNHANDLED-PROMISE', 'error', `Promise: ${e.reason?.message || e.reason}`);
    };
  </script>

  <!-- [B] UNIFIED STORAGE DRIVER (TEXT: OPFS/LOCALSTORAGE · BINARY: OPFS/INDEXEDDB) -->
  <script id="fs-source">
    (function (global) {
      'use strict';

      class FileSystemDriver {
        #rootDir = null;
        #prefix = 'ts_fs_';
        #blobDbPromise = null;
        #blobDbName = 'ts_spa_binary_v1';
        #blobStoreName = 'assets';
        #blobFallbackLogged = false;

        async #getDir() {
          if (!this.#rootDir) {
            if (!navigator.storage?.getDirectory) {
              throw new Error('OPFS_UNSUPPORTED');
            }
            this.#rootDir = await navigator.storage.getDirectory();
          }
          return this.#rootDir;
        }

        async #getBlobDB() {
          if (!globalThis.indexedDB) throw new Error('INDEXEDDB_UNSUPPORTED');
          if (!this.#blobDbPromise) {
            this.#blobDbPromise = new Promise((resolve, reject) => {
              const request = indexedDB.open(this.#blobDbName, 1);
              request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains(this.#blobStoreName)) {
                  db.createObjectStore(this.#blobStoreName);
                }
              };
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error || new Error('INDEXEDDB_OPEN_FAILED'));
              request.onblocked = () => reject(new Error('INDEXEDDB_BLOCKED'));
            }).catch(error => {
              this.#blobDbPromise = null;
              throw error;
            });
          }
          return await this.#blobDbPromise;
        }

        async #putBlobFallback(path, blob) {
          const db = await this.#getBlobDB();
          await new Promise((resolve, reject) => {
            const tx = db.transaction(this.#blobStoreName, 'readwrite');
            tx.objectStore(this.#blobStoreName).put(blob, path);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error || new Error('INDEXEDDB_WRITE_FAILED'));
            tx.onabort = () => reject(tx.error || new Error('INDEXEDDB_WRITE_ABORTED'));
          });
        }

        async #getBlobFallback(path) {
          const db = await this.#getBlobDB();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(this.#blobStoreName, 'readonly');
            const request = tx.objectStore(this.#blobStoreName).get(path);
            request.onsuccess = () => resolve(request.result instanceof Blob ? request.result : null);
            request.onerror = () => reject(request.error || new Error('INDEXEDDB_READ_FAILED'));
          });
        }

        async #deleteBlobFallback(path) {
          const db = await this.#getBlobDB();
          await new Promise((resolve, reject) => {
            const tx = db.transaction(this.#blobStoreName, 'readwrite');
            tx.objectStore(this.#blobStoreName).delete(path);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error || new Error('INDEXEDDB_DELETE_FAILED'));
            tx.onabort = () => reject(tx.error || new Error('INDEXEDDB_DELETE_ABORTED'));
          });
        }

        async #listBlobFallback() {
          const db = await this.#getBlobDB();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(this.#blobStoreName, 'readonly');
            const request = tx.objectStore(this.#blobStoreName).getAllKeys();
            request.onsuccess = () => resolve(request.result.map(String));
            request.onerror = () => reject(request.error || new Error('INDEXEDDB_LIST_FAILED'));
          });
        }

        #logBlobFallback(opfsError) {
          if (this.#blobFallbackLogged) return;
          this.#blobFallbackLogged = true;
          globalThis.Logger?.log('FS', 'warn', 'OPFS unavailable for binary assets; using IndexedDB fallback', {
            backend: 'indexeddb',
            opfsError: opfsError?.name || 'Error',
            detail: opfsError?.message || String(opfsError || '')
          });
        }

        #storageError(opfsError, fallbackError) {
          const error = new Error(`BINARY_STORAGE_UNAVAILABLE: OPFS=${opfsError?.name || 'Error'}, IndexedDB=${fallbackError?.name || 'Error'}`);
          error.name = 'StorageError';
          error.opfsError = opfsError;
          error.fallbackError = fallbackError;
          return error;
        }

        async read(path) {
          try {
            const root = await this.#getDir();
            const handle = await root.getFileHandle(path);
            const file = await handle.getFile();
            return await file.text();
          } catch (err) {
            if (err.name === 'NotFoundError') return localStorage.getItem(this.#prefix + path);
            return localStorage.getItem(this.#prefix + path);
          }
        }

        async write(path, content) {
          try {
            const root = await this.#getDir();
            const handle = await root.getFileHandle(path, { create: true });
            const writable = await handle.createWritable();
            await writable.write(content);
            await writable.close();
          } catch (_) {
            localStorage.setItem(this.#prefix + path, content);
          }
        }

        async writeBlob(path, blob) {
          if (!(blob instanceof Blob)) throw new TypeError('BLOB_REQUIRED');
          let opfsError = null;
          try {
            const root = await this.#getDir();
            const handle = await root.getFileHandle(path, { create: true });
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            return 'opfs';
          } catch (error) {
            opfsError = error;
            try {
              const root = await this.#getDir();
              await root.removeEntry(path);
            } catch (_) {}
          }

          try {
            await this.#putBlobFallback(path, blob);
            this.#logBlobFallback(opfsError);
            return 'indexeddb';
          } catch (fallbackError) {
            throw this.#storageError(opfsError, fallbackError);
          }
        }

        async readBlob(path) {
          let opfsError = null;
          try {
            const root = await this.#getDir();
            const handle = await root.getFileHandle(path);
            return await handle.getFile();
          } catch (error) {
            opfsError = error;
          }

          try {
            return await this.#getBlobFallback(path);
          } catch (fallbackError) {
            if (opfsError?.name === 'NotFoundError') return null;
            throw this.#storageError(opfsError, fallbackError);
          }
        }

        async removeBlob(path) {
          let opfsError = null;
          let fallbackError = null;
          let opfsAvailable = false;
          let fallbackAvailable = false;

          try {
            const root = await this.#getDir();
            try { await root.removeEntry(path); } catch (error) {
              if (error?.name !== 'NotFoundError') throw error;
            }
            opfsAvailable = true;
          } catch (error) {
            opfsError = error;
          }

          try {
            await this.#deleteBlobFallback(path);
            fallbackAvailable = true;
          } catch (error) {
            fallbackError = error;
          }

          if (!opfsAvailable && !fallbackAvailable) throw this.#storageError(opfsError, fallbackError);
          return true;
        }

        async listBlobs() {
          const names = new Set();
          let opfsError = null;
          let fallbackError = null;
          let opfsAvailable = false;
          let fallbackAvailable = false;

          try {
            const root = await this.#getDir();
            for await (const [name, handle] of root.entries()) {
              if (handle.kind === 'file') names.add(name);
            }
            opfsAvailable = true;
          } catch (error) {
            opfsError = error;
          }

          try {
            const blobNames = await this.#listBlobFallback();
            blobNames.forEach(name => names.add(name));
            fallbackAvailable = true;
          } catch (error) {
            fallbackError = error;
          }

          if (!opfsAvailable && !fallbackAvailable) throw this.#storageError(opfsError, fallbackError);
          return [...names];
        }

        async remove(path) {
          try {
            const root = await this.#getDir();
            await root.removeEntry(path);
          } catch (_) {}

          try { localStorage.removeItem(this.#prefix + path); } catch (_) {}
          try { await this.#deleteBlobFallback(path); } catch (_) {}
        }

        async list() {
          const names = new Set();
          try {
            const root = await this.#getDir();
            for await (const [name, handle] of root.entries()) {
              if (handle.kind === 'file') names.add(name);
            }
          } catch (_) {}

          try {
            Object.keys(localStorage)
              .filter(key => key.startsWith(this.#prefix))
              .forEach(key => names.add(key.replace(this.#prefix, '')));
          } catch (_) {}

          try {
            const blobNames = await this.#listBlobFallback();
            blobNames.forEach(name => names.add(name));
          } catch (_) {}

          return [...names];
        }
      }

      global.FS = Object.freeze(new FileSystemDriver());
    })(window);
  </script>

  <script id="app-source">
    (function () {

      const $ = (sel, parent = document) => parent.querySelector(sel);

        URL.revokeObjectURL(url);
      };

      const exportJSON = (filename, content = '{}') => {
        const blob = new Blob(['\uFEFF' + content], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename.endsWith('.json') ? filename : `${filename}.json`;
        a.click();
        URL.revokeObjectURL(url);

      const escapeHTML = (value = '') => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
      const closeActiveModal = () => {
        const overlay = $('.modal-overlay');
        if (!overlay) return false;
        const closeButton = $('[data-modal-close]', overlay);
        if (closeButton) closeButton.click();
        else overlay.remove();
        return true;
      };


      const segmenter = window.Intl?.Segmenter ? new Intl.Segmenter('th', { granularity: 'grapheme' }) : null;
      const getVisualLength = (str = '') => {
        if (!segmenter) return str.length;
        let count = 0;
        for (const _ of segmenter.segment(str)) count++;
        return count;
      };

      /* --- [2] JSON FORM DOMAIN MODEL --- */
      class JSONFormModel {
        static parse(text = '{}') {
          try {
            const schema = JSON.parse(text || '{}');
            if (!schema.screen || typeof schema.screen !== 'object' || Array.isArray(schema.screen) || !Array.isArray(schema.fields)) {
              throw new Error('ต้องมี screen และ fields[]');
            }

            if (!Array.isArray(schema.data)) {
              const legacyRows = Array.isArray(schema.records) ? schema.records : [];
              schema.data = legacyRows.map(row => {
                if (!row || typeof row !== 'object' || Array.isArray(row)) return row;
                const next = { ...row };
                if (!Object.hasOwn(next, 'id') && Object.hasOwn(next, 'pk')) next.id = next.pk;
                delete next.pk;
                return next;
              });
            }

            const primaryIndex = schema.fields.findIndex(field => field?.id === 'id');
            if (primaryIndex === -1) {
              schema.fields.unshift({ id: 'id', label: 'ID', type: 'autoIncrement', required: true });
            } else if (primaryIndex !== 0) {
              const [primaryField] = schema.fields.splice(primaryIndex, 1);
              schema.fields.unshift(primaryField);
            }

            const supportedTypes = new Set(['autoIncrement', 'input', 'textarea', 'select', 'checkbox', 'file']);
            const supportedInputTypes = new Set(['text', 'number', 'date', 'password']);
            const reservedIds = new Set(['__proto__', 'prototype', 'constructor']);
            const seenIds = new Set();

            schema.fields = schema.fields.map((rawField, index) => {
              if (!rawField || typeof rawField !== 'object' || Array.isArray(rawField)) {
                throw new Error(`Field ลำดับ ${index + 1} ไม่ถูกต้อง`);
              }

              const field = { ...rawField };
              field.id = String(field.id ?? '').trim();
              if (!field.id) throw new Error(`Field ลำดับ ${index + 1} ต้องมี id`);
              if (reservedIds.has(field.id)) throw new Error(`Field ID "${field.id}" ไม่อนุญาต`);
              if (seenIds.has(field.id)) throw new Error(`Field ID "${field.id}" ซ้ำ`);
              seenIds.add(field.id);

              if (index === 0) {
                if (field.id !== 'id') throw new Error('Field แรกต้องเป็น System PK id');
                field.label = String(field.label || 'ID');
                field.type = 'autoIncrement';
                field.required = true;
                delete field.inputType;
                delete field.options;
                delete field.accept;
                delete field.placeholder;
                return field;
              }

              if (field.id === 'id') throw new Error('System PK id ต้องมีเพียงหนึ่ง Field');
              field.type = String(field.type || '').trim();
              if (!supportedTypes.has(field.type) || field.type === 'autoIncrement') {
                throw new Error(`Field "${field.id}" มี type ที่ไม่รองรับ: ${field.type || '(ว่าง)'}`);
              }

              field.label = String(field.label ?? field.id);
              field.required = field.type === 'checkbox' ? false : field.required === true;

              if (field.type === 'input') {
                field.inputType = String(field.inputType || 'text');
                if (!supportedInputTypes.has(field.inputType)) {
                  throw new Error(`Field "${field.id}" มี inputType ที่ไม่รองรับ: ${field.inputType}`);
                }
                field.placeholder = String(field.placeholder || '');
                delete field.options;
                delete field.accept;
              } else if (field.type === 'textarea') {
                field.placeholder = String(field.placeholder || '');
                field.rows = Math.max(2, Math.min(20, Number(field.rows) || 5));
                delete field.inputType;
                delete field.options;
                delete field.accept;
              } else if (field.type === 'select') {
                field.options = Array.isArray(field.options)
                  ? field.options.map(value => String(value)).filter(Boolean)
                  : [];
                delete field.inputType;
                delete field.accept;
                delete field.placeholder;
              } else if (field.type === 'file') {
                field.accept = String(field.accept || '*/*');
                delete field.inputType;
                delete field.options;
                delete field.placeholder;
              } else {
                delete field.inputType;
                delete field.options;
                delete field.accept;
                delete field.placeholder;
              }

              return field;
            });

            schema.data = schema.data.filter(row => row && typeof row === 'object' && !Array.isArray(row));
            delete schema.database;
            delete schema.records;
            return { schema, error: null };
          } catch (error) {
            return { schema: null, error };
          }
        }

        static getNextId(schema) {
          const rows = Array.isArray(schema?.data) ? schema.data : [];
          let maxId = 0;
          for (const row of rows) {
            const id = Number.parseInt(row?.id, 10);
            if (Number.isFinite(id) && id > maxId) maxId = id;
          }
          return maxId + 1;
        }

        static findRowIndex(schema, id) {
          return Array.isArray(schema?.data)
            ? schema.data.findIndex(row => Number(row?.id) === Number(id))
            : -1;
        }

        static sameStorageType(a, b) {
          if (!a || !b || a.type !== b.type) return false;
          if (a.type === 'input') return (a.inputType || 'text') === (b.inputType || 'text');
          return true;
        }

        static isPasswordField(field) {
          return field?.type === 'input' && field?.inputType === 'password';
        }

        static isPasswordRecord(value) {
          return Boolean(
            value && typeof value === 'object' && !Array.isArray(value) &&
            value.algorithm === 'PBKDF2-SHA256' &&
            Number.isInteger(value.iterations) && value.iterations > 0 &&
            typeof value.salt === 'string' && value.salt &&
            typeof value.hash === 'string' && value.hash
          );
        }

        static inspectAuthSource(schema) {
          const fields = Array.isArray(schema?.fields) ? schema.fields : [];
          const rows = Array.isArray(schema?.data) ? schema.data : [];
          const emailField = fields.find(field => field?.id === 'email');
          const passwordField = fields.find(field => field?.id === 'password');

          if (!emailField) {
            return { ok: false, reason: 'email-field-missing', totalUsers: rows.length, configuredUsers: 0, unconfiguredUsers: rows.length };
          }
          if (!passwordField) {
            return { ok: false, reason: 'legacy-password-field-missing', totalUsers: rows.length, configuredUsers: 0, unconfiguredUsers: rows.length };
          }
          if (!this.isPasswordField(passwordField)) {
            return { ok: false, reason: 'password-field-invalid', totalUsers: rows.length, configuredUsers: 0, unconfiguredUsers: rows.length };
          }

          let configuredUsers = 0;
          let inactiveUsers = 0;
          const emailCounts = new Map();
          for (const row of rows) {
            if (this.isPasswordRecord(row?.password)) configuredUsers++;
            if (Object.hasOwn(row || {}, 'active') && row.active === false) inactiveUsers++;
            const normalizedEmail = String(row?.email || '').trim().toLowerCase();
            if (normalizedEmail) emailCounts.set(normalizedEmail, (emailCounts.get(normalizedEmail) || 0) + 1);
          }

          const duplicateEmailCount = [...emailCounts.values()].filter(count => count > 1).length;
          if (duplicateEmailCount > 0) {
            return {
              ok: false,
              reason: 'duplicate-email',
              totalUsers: rows.length,
              configuredUsers,
              unconfiguredUsers: rows.length - configuredUsers,
              inactiveUsers,
              duplicateEmailCount
            };
          }

          return {
            ok: true,
            reason: null,
            totalUsers: rows.length,
            configuredUsers,
            unconfiguredUsers: rows.length - configuredUsers,
            inactiveUsers,
            duplicateEmailCount: 0
          };
        }

        static bytesToBase64(bytes) {
          return btoa(String.fromCharCode(...bytes));
        }

        static base64ToBytes(value) {
          const binary = atob(String(value || ''));
          return Uint8Array.from(binary, char => char.charCodeAt(0));
        }

        static async hashPassword(password) {
          const plain = String(password ?? '');
          if (!plain) return null;
          if (!globalThis.crypto?.subtle || !globalThis.crypto?.getRandomValues) {
            throw new Error('WEB_CRYPTO_UNAVAILABLE');
          }

          const iterations = 120000;
          const salt = new Uint8Array(16);
          globalThis.crypto.getRandomValues(salt);
          const key = await globalThis.crypto.subtle.importKey(
            'raw',
            new TextEncoder().encode(plain),
            { name: 'PBKDF2' },
            false,
            ['deriveBits']
          );
          const bits = await globalThis.crypto.subtle.deriveBits(
            { name: 'PBKDF2', hash: 'SHA-256', salt, iterations },
            key,
            256
          );
          return {
            algorithm: 'PBKDF2-SHA256',
            iterations,
            salt: this.bytesToBase64(salt),
            hash: this.bytesToBase64(new Uint8Array(bits))
          };
        }

        static async verifyPassword(password, stored) {
          if (!this.isPasswordRecord(stored) || !globalThis.crypto?.subtle) return false;
          try {
            const salt = this.base64ToBytes(stored.salt);
            const key = await globalThis.crypto.subtle.importKey(
              'raw',
              new TextEncoder().encode(String(password ?? '')),
              { name: 'PBKDF2' },
              false,
              ['deriveBits']
            );
            const bits = new Uint8Array(await globalThis.crypto.subtle.deriveBits(
              { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: stored.iterations },
              key,
              256
            ));
            const expected = this.base64ToBytes(stored.hash);
            if (bits.length !== expected.length) return false;
            let diff = 0;
            for (let i = 0; i < bits.length; i++) diff |= bits[i] ^ expected[i];
            return diff === 0;
          } catch (_) {
            return false;
          }
        }

        static defaultValue(field) {
          if (field?.type === 'file' || this.isPasswordField(field)) return null;
          if (field?.type === 'checkbox') return false;
          if (field?.type === 'select') return field.options?.[0] ?? '';
          if (field?.type === 'input' && (field.inputType === 'number' || field.inputType === 'date')) return null;
          return '';
        }

        static prepareFieldsUpdate(schema, proposedFields) {
          const currentResult = this.parse(JSON.stringify(schema || {}));
          if (currentResult.error || !currentResult.schema) throw currentResult.error || new Error('SCHEMA_INVALID');
          if (!Array.isArray(proposedFields)) throw new Error('ต้องมี fields[]');

          const candidate = {
            ...currentResult.schema,
            fields: JSON.parse(JSON.stringify(proposedFields))
          };
          const nextResult = this.parse(JSON.stringify(candidate));
          if (nextResult.error || !nextResult.schema) throw nextResult.error || new Error('FIELDS_INVALID');

          const current = currentResult.schema;
          const next = nextResult.schema;
          const oldFields = current.fields || [];
          const newFields = next.fields || [];
          const oldById = new Map(oldFields.map(field => [field.id, field]));
          const newIds = new Set(newFields.map(field => field.id));
          const renameSourceByNewId = new Map();

          for (let index = 1; index < newFields.length; index++) {
            const field = newFields[index];
            if (oldById.has(field.id)) continue;
            const oldAtIndex = oldFields[index];
            if (!oldAtIndex || newIds.has(oldAtIndex.id)) continue;
            if (this.sameStorageType(oldAtIndex, field)) renameSourceByNewId.set(field.id, oldAtIndex.id);
          }

          const retiredByPath = new Map();
          next.data = (current.data || []).map(row => {
            const rebuilt = { id: row.id };
            const oldFileValues = oldFields
              .filter(field => field.type === 'file')
              .map(field => row?.[field.id])
              .filter(value => value?.path);

            for (let index = 1; index < newFields.length; index++) {
              const field = newFields[index];
              const sourceId = oldById.has(field.id) ? field.id : renameSourceByNewId.get(field.id);
              const sourceField = sourceId ? oldById.get(sourceId) : null;

              if (sourceField && this.sameStorageType(sourceField, field)) {
                const sourceValue = row?.[sourceId];
                if (field.type === 'file') {
                  rebuilt[field.id] = sourceValue?.path ? sourceValue : null;
                } else if (field.type === 'select') {
                  rebuilt[field.id] = field.options?.includes(String(sourceValue))
                    ? String(sourceValue)
                    : this.defaultValue(field);
                } else {
                  rebuilt[field.id] = this.normalizeValue(field, sourceValue);
                }
              } else {
                rebuilt[field.id] = this.defaultValue(field);
              }
            }

            const retainedFilePaths = new Set(
              newFields
                .filter(field => field.type === 'file')
                .map(field => rebuilt[field.id]?.path)
                .filter(Boolean)
            );
            oldFileValues.forEach(meta => {
              if (!retainedFilePaths.has(meta.path)) retiredByPath.set(meta.path, meta);
            });
            return rebuilt;
          });

          return { schema: next, retiredFiles: [...retiredByPath.values()] };
        }

        static normalizeValue(field, rawValue) {

          }
          if (field?.type === 'input' && field?.inputType === 'date') {

      class FileAssetStore {
        sanitize(value = '') {
          return String(value).replace(/[^a-zA-Z0-9._-]+/g, '_').replace(/^_+|_+$/g, '') || 'file';
        }

        async save(docId, rowId, fieldId, file) {
          if (!(file instanceof File)) throw new TypeError('FILE_REQUIRED');
          const path = `asset_${this.sanitize(docId)}_${Number(rowId) || 0}_${this.sanitize(fieldId)}_${Date.now()}_${this.sanitize(file.name)}`;
          await window.FS?.writeBlob(path, file);
          return {
            name: file.name,
            path,
            mimeType: file.type || 'application/octet-stream',
            size: file.size,
            lastModified: Number(file.lastModified) || null
          };
        }

        async read(meta) {
          if (!meta?.path) return null;
          return await window.FS?.readBlob(meta.path);
        }

        async download(meta) {
          const blob = await this.read(meta);
          if (!blob) throw new Error('FILE_NOT_FOUND');
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = meta?.name || 'download';
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async remove(meta) {
          if (!meta?.path) return true;
          await window.FS?.removeBlob(meta.path);
          return true;
        }

        async removeMany(items = [], context = 'asset-cleanup') {
          const unique = [...new Map(items.filter(item => item?.path).map(item => [item.path, item])).values()];
          if (!unique.length) return true;
          const results = await Promise.allSettled(unique.map(item => this.remove(item)));
          const failed = results
            .map((result, index) => ({ result, item: unique[index] }))
            .filter(entry => entry.result.status === 'rejected');
          if (failed.length) {
            window.Logger?.log('FS', 'warn', 'Binary asset cleanup incomplete', {
              context,
              failed: failed.length,
              paths: failed.slice(0, 5).map(entry => entry.item.path),
              errors: failed.slice(0, 5).map(entry => entry.result.reason?.message || String(entry.result.reason || ''))
            });
            return false;
          }
          return true;
        }

        async removeDocumentAssets(docId) {
          const prefix = `asset_${this.sanitize(docId)}_`;
          try {
            const names = await window.FS?.listBlobs?.() || [];
            return await this.removeMany(
              names.filter(name => name.startsWith(prefix)).map(path => ({ path })),

            );
          } catch (error) {
            window.Logger?.log('FS', 'warn', 'Unable to enumerate document binary assets', {
              document: docId,
              error: error?.message || String(error || '')
            });
            return false;
          }
        }

          return fields
            .filter(field => field?.type === 'file')
            .map(field => row?.[field.id])
            .filter(value => value?.path);
        }

  "index": "# SPA Codebase Map & Structural Index\n\n**Current version:** `v14.6.3-modal-close-policy`\n\n**Status:** Candidate — frozen baseline is `v14.6.1-auth-compatibility`.\n\nระบบเป็น Vanilla JS / Zero Dependency workspace รองรับ Markdown และ JSON Form แบบฐานข้อมูลง่าย ๆ โดยคง schema หลัก `screen + fields + data` และมีหน้าจอพื้นฐาน Login / Users / Files / Images / Videos\n\n## 1. Development Shell\n```text\n60-json-form.html\n├── CSS / Logger / FileSystemDriver\n├── Utilities / Thai IME\n├── Managed System Docs\n├── JSONFormModel + validation + Basic Screen Templates\n├── FileAssetStore\n├── WorkspaceStateStore\n├── WorkspaceUI + View Methods\n└── Live Production Extractor\n```\n\n## 2. Production Modules\n```text\nindex.html\ncss/app.css\njs/\n├── logger.js\n├── fs.js\n├── utils.js\n├── system-docs.js\n├── json-form.js\n├── file-assets.js\n├── store.js\n├── workspace-ui.js\n├── markdown-view.js\n├── json-form-view.js\n├── login-view.js\n├── json-fields-view.js\n├── json-data-view.js\n├── rows-crud-view.js\n└── app.js\n```\n\n## 3. Basic JSON Form Screens\nตัวเลือก `＋ Form` มี template พื้นฐาน 5 แบบ:\n- `Login` — อ่าน `users.json` ข้าม document, verify password hash และบันทึก Login history\n- `Users` — Text / Password Hash / Select / Checkbox CRUD\n- `Files` — Upload / Download ไฟล์ทั่วไป\n- `Images` — Upload / Preview / Download รูป (`accept: image/*`)\n- `Videos` — Upload / Preview / Download วิดีโอ (`accept: video/*`)\n\nทุก template ใช้ engine และ schema เดียวกัน ไม่มี database abstraction แยกตามชนิดหน้าจอ\n\n## 4. Login Cross-Document Flow\nLogin เป็น Action Screen ผ่าน `screen.action: \"login\"` และ `screen.source: \"users.json\"`.\n1. รับ Email + Password ใน UI โดยไม่ persist credential ลง `login.json`\n2. ค้น document `users.json` จาก `WorkspaceStateStore.projects` และ parse ด้วย `JSONFormModel`\n3. เทียบ Email แบบ case-insensitive, ต้องไม่เป็น user ที่ `active: false`, แล้วตรวจรหัสผ่านด้วย `verifyPassword()`\n4. สำเร็จแล้วบันทึกเฉพาะ `{ id, userId, email, name, role, loginAt }` ลง `login.json.data[]`\n5. ก่อน verify ต้องตรวจ Auth compatibility ของ `users.json`: ต้องมี `email` และ `password` field แบบ `input/password`; user เก่าที่ไม่มี password hash ต้องถูกแจ้งว่า `password-not-configured` โดยห้ามสร้าง credential อัตโนมัติ\n6. แยก diagnostic reason สำหรับ `source-not-found`, `source-ambiguous`, `legacy-password-field-missing`, `password-field-invalid`, `account-inactive`, `password-not-configured`, `web-crypto-unavailable`, `credentials-rejected` โดย UI แสดงข้อความที่ช่วยแก้ setup ได้ และ Logger ห้ามมี password/hash/salt\n7. Failed login ไม่ถูกบันทึกเป็น record\n\nLogin/Users cross-document path **ไม่ใช้ IndexedDB** และไม่เรียก binary API. JSON document ใช้ text storage เดิมผ่าน `window.FS.read/write`: OPFS primary และ LocalStorage fallback. IndexedDB ยังคงใช้เฉพาะ binary fallback ของ Files/Images/Videos เท่านั้น.\n\n## 5. Field Types / Invariants\nรองรับ `autoIncrement`, `input` (`text | number | date | password`), `textarea`, `select`, `checkbox`, `file`. Field ID ต้องไม่ว่างและห้ามซ้ำ; Number/Date ว่าง = `null` และ Checkbox = boolean.\n\n### Users Password Simulation\n- `users.json` ห้ามเก็บ plaintext password; เก็บ `{ algorithm, iterations, salt, hash }`\n- Web Crypto `PBKDF2-SHA256` + random salt, 120000 iterations\n- Rows แสดง `••••••••`; Edit เว้นว่าง = คง hash เดิม\n- เป็น client-side authentication simulation เท่านั้น; production auth จริงต้องทำ server-side\n\n## 6. Fields Editing Safety\nProperties และ `FIELDS JSON` ใช้ validation ชุดเดียวจาก `JSONFormModel`; structural change ต้องกด `✓ Apply Fields` จึง persist/migrate/cleanup.\n\n## 7. File Data / Binary Storage\nJSON เก็บเฉพาะ metadata; Binary ใช้ OPFS primary → IndexedDB Blob fallback และห้าม binary fallback ไป LocalStorage. กฎนี้เป็นของ File/Media เท่านั้น ไม่เกี่ยวกับ Login.\n\n## 8. CRUD / PK / Layout\n- ID ใหม่ = `max(id)+1` ด้วย loop; ห้าม reuse/renumber\n- Create/Edit/Properties = `Label ซ้าย | Component ขวา`\n- JSON Form ใช้กรอบหลัก 1 ชั้นและ scroll เฉพาะ content region\n- Data/Rows paginate 100 rows/page\n\n## 9. Legacy Users Auth Compatibility\n- System docs sync ห้ามแก้ `users.json` ของผู้ใช้เงียบ ๆ\n- Login แสดงสถานะ Source/Auth ก่อน submit: พร้อม, พร้อมบางส่วน, Users รุ่นเก่า, Source ผิด หรือชื่อซ้ำ\n- ถ้า `users.json` รุ่นเก่าไม่มี Password field ให้ใช้ `＋ Password`; ระบบจะสร้าง canonical field id `password` (เมื่อยังไม่มี) แล้วผู้ใช้ตั้งรหัสผ่านต่อ user เอง\n- ห้ามรับ plaintext password เก่าหรือสร้าง default password เพื่อ migration อัตโนมัติ\n\n\n## 10. Runtime-Proven Freeze Evidence\nก่อน Freeze v14.6.1 ได้ทดสอบผ่าน UI จริงแล้ว: `login.json` อ่าน `users.json` ข้าม document, ปฏิเสธ user `active:false` ด้วย `account-inactive`, หลังแก้ user และ persist แล้วสามารถ Login สำเร็จ และบันทึก Login history ลง `login.json` ด้วย `loginRecordId=1`. ลำดับ log ที่ยืนยันคือ `STORE Saved [users.json]` → `STORE Saved [login.json] reason=login-success` → `AUTH Login succeeded`.\n\n\n## 11. Auth Presentation Ownership (v14.6.2)\n- `js/login-view.js` เป็นเจ้าของ Login UI + submit/cross-document orchestration\n- `js/json-form-view.js` เหลือหน้าที่ JSON Form create/collect/persist ทั่วไป\n- `js/json-form.js` ยังคงเป็นเจ้าของ password hash/verify และ auth-source validation\n- Auth source ที่มี Email ซ้ำแบบ case-insensitive ต้องถูกปฏิเสธด้วย `duplicate-email`; ห้ามเลือก record แรกแบบเงียบ ๆ\n\n\n## 12. Code Ownership Quick Map\n| Module | หน้าที่หลัก |\n|---|---|\n| `js/json-form.js` | Schema/invariants, templates, password hash/verify, auth-source validation |\n| `js/login-view.js` | Login UI, source lookup, credential orchestration, login-history persist |\n| `js/json-form-view.js` | Generic Form/Create, collect values, persist JSON Form |\n| `js/json-fields-view.js` | Fields JSON draft/apply และ Properties |\n| `js/json-data-view.js` | Data JSON preview/copy/pagination |\n| `js/rows-crud-view.js` | Rows Read/Edit/Delete + file download/preview |\n| `js/store.js` | Workspace state, document lifecycle, persistence orchestration |\n| `js/fs.js` | Text storage และ binary storage driver/fallback |\n| `js/file-assets.js` | File metadata + binary lifecycle ของ File/Image/Video |\n| `js/system-docs.js` | Managed docs/version synchronization |\n| `js/workspace-ui.js` | Shell, routing, docks, shared presentation |\n| `js/app.js` | Production composition root / install views |\n\n## 13. Modal Interaction Policy (v14.6.3)\n- Modal ที่มีปุ่มปิด `×` ต้องใช้ explicit close; การคลิก backdrop/พื้นที่นอกกล่อง **ห้ามปิด modal**\n- `Edit Row` ปิดได้ด้วย `×` หรือปุ่ม `ยกเลิก` เท่านั้น เพื่อป้องกันข้อมูลที่กำลังแก้ไขหายจากการคลิกพลาด\n- File/Image/Video Preview ปิดด้วย `×`; Production Bundle modal ปิดด้วย `×`\n- ปุ่มปิด modal ใช้ `data-modal-close`, `aria-label` และขนาด click target ที่สม่ำเสมอ\n- `closeActiveModal()` ใช้เฉพาะตอนระบบต้องแทน modal เดิมด้วย modal ใหม่ เพื่อให้ custom cleanup เช่น `URL.revokeObjectURL()` ทำงานก่อนปิด\n- Production module list ของ v14.6.2+ ต้องมี `js/login-view.js`; หาก Live Extracted list ไม่มีไฟล์นี้ แสดงว่ากำลังใช้ source/cache รุ่นก่อน\n\n",
  "handoff": "# Engineering Handoff Protocol\n\n**Version:** `v14.6.3-modal-close-policy`\n\n**Status:** Candidate — frozen baseline is `v14.6.1-auth-compatibility`.\n\n## 1. Strict Architecture Rules\n1. Zero Framework / Zero Dependency\n2. Development Shell ต้อง Self-Extracting และ Production แยก module ตาม ownership\n3. Mount-Once shell; ห้าม remount root ทั้งหน้า\n4. ห้ามย้าย CRUD/Fields/Data กลับเข้า `workspace-ui.js`\n5. ใช้ schema `screen + fields + data`; ห้ามเพิ่ม database abstraction โดยไม่มี requirement\n\n## 2. Basic Screen / Component Scope\nรองรับ Login, Users, Files, Images, Videos และ field หลัก `autoIncrement`, text, number, date, password, textarea, select, checkbox, file.\n\n## 3. Login Cross-Document Rules\n1. Login ใช้ `screen.action: \"login\"` + `screen.source: \"users.json\"`\n2. Credential input มีไว้ใน UI เท่านั้น; ห้าม persist plaintext password หรือ password hash ซ้ำใน `login.json`\n3. อ่าน user source จาก `store.projects` แล้ว parse ด้วย `JSONFormModel`; ห้าม copy users data ไปเป็น auth cache\n4. Email compare แบบ case-insensitive; `active: false` ต้อง login ไม่ผ่าน\n5. ตรวจ password ผ่าน `JSONFormModel.verifyPassword()` เท่านั้น\n6. Login สำเร็จจึง append `{ id, userId, email, name, role, loginAt }` ลง `login.json.data[]`; failed login ไม่ append record\n7. AUTH log ห้ามมี password/hash/salt\n8. Login/Users cross-document flow ห้ามเรียก `writeBlob/readBlob/removeBlob/listBlobs` และห้ามใช้ IndexedDB; ใช้ text document persistence ผ่าน Workspace/FS เท่านั้น\n9. IndexedDB ที่มีอยู่ในระบบอนุญาตเฉพาะ File/Media binary fallback เดิม\n10. ก่อน verify ต้องเรียก `JSONFormModel.inspectAuthSource()`; ห้ามตีความ Users schema เก่าที่ไม่มี Password ว่าเป็นเพียง `credentials-rejected`\n11. ห้าม auto-migrate credential: ไม่สร้าง password, salt หรือ hash ให้ user เก่าโดยอัตโนมัติ\n12. `password-not-configured` และ `account-inactive` อาจระบุ `userId` ใน AUTH log ได้ แต่ห้าม log credential material\n\n## 4. JSON Form Invariants\n- `id` เป็น System PK เดียว, field แรก, `autoIncrement`, `required: true`\n- Field ID ต้อง non-empty, unique และห้าม reserved prototype keys\n- ID ใหม่ = `max(id)+1` ด้วย loop; ห้าม reuse/renumber\n- Number/Date ว่าง = `null`; Checkbox = boolean; File/Password default = `null`\n- Field ใหม่ต้องใช้ `JSONFormModel.defaultValue(field)`\n\n## 5. Password Simulation Rules\n- `users.json` ห้าม persist plaintext password\n- เก็บ PBKDF2-SHA256 `{ algorithm, iterations, salt, hash }` ด้วย Web Crypto + random salt\n- Edit เว้นว่าง = คง hash เดิม; Rows ห้ามแสดง hash/salt\n- เป็น simulation เท่านั้น; production authentication ต้องทำ server-side\n\n## 6. Fields / File Safety\n- Fields JSON เป็น draft-only และต้องกด `✓ Apply Fields` ก่อน structural migration\n- File field cleanup ต้อง persist logical change ก่อน cleanup binary\n- Binary storage: OPFS → IndexedDB fallback; ไม่ใช้ LocalStorage สำหรับ binary\n\n## 7. Verified at Freeze\nตรวจ Login แบบ end-to-end: สร้าง/แก้ user ใน `users.json`, login จาก `login.json`, password ถูก/ผิด, inactive user, login history persist หลัง reload, password ไม่ปรากฏใน login.json/log และยืนยันว่า login path ไม่เรียก IndexedDB/binary API.\n\n## 8. Legacy Users Compatibility\n- `users.json` ที่สร้างก่อน Password feature อาจไม่มี field `password`; ต้องแจ้ง setup required อย่างชัดเจน และ `＋ Password` ต้องสร้าง canonical id `password` เมื่อยังไม่มี\n- Password field ที่ใช้ Login ต้องเป็น `{ type: \"input\", inputType: \"password\" }`\n- Record ที่ยังไม่มี PBKDF2 object ต้องถูกปฏิเสธด้วย `password-not-configured`; ผู้ใช้ต้องตั้ง password ผ่าน Users Edit เอง\n- Source filename ซ้ำมากกว่า 1 document ต้องหยุดด้วย `source-ambiguous` แทนการเลือกเอกสารแรกแบบเงียบ ๆ\n\n\n## 9. Frozen Baseline Rule\n`v14.6.1-auth-compatibility` เป็น baseline ที่พิสูจน์ end-to-end ผ่าน UI จริงแล้ว ห้ามแก้ไฟล์ Frozen ย้อนหลัง; v14.6.3 ต้องต่อยอดจาก baseline นี้เท่านั้น.\n\n\n## 10. Auth Module / Identity Safety\n- Production Login presentation ต้องอยู่ `login-view.js`; ห้ามย้ายกลับไปรวมกับ generic CRUD/Workspace shell\n- `inspectAuthSource()` ต้อง reject normalized Email ซ้ำด้วย `duplicate-email` ก่อนตรวจ credential เพื่อป้องกันการเลือก user แรกแบบคลุมเครือ\n- Logger รายงานจำนวน duplicate ได้ แต่ไม่ควร log รายชื่อ Email ที่ซ้ำโดยไม่จำเป็น\n\n## 11. Modal Close Policy\n- Modal ที่แสดงปุ่ม `×` ห้ามปิดจาก backdrop click; ผู้ใช้ต้องปิดด้วย control ที่ตั้งใจไว้\n- Edit Row อนุญาต `×` และ `ยกเลิก`; Preview/Bundle ใช้ `×`\n- ทุก modal close button ต้องมี `data-modal-close` และ accessible label/title\n- เมื่อเปิด modal ใหม่ ให้เรียก `closeActiveModal()` แทน `.remove()` ตรง ๆ เพื่อไม่ข้าม cleanup handler ของ modal เดิม\n- ห้ามเพิ่ม backdrop-dismiss กลับมาโดยไม่มี requirement ชัดเจน เพราะเสี่ยง accidental data loss ในหน้าจอแก้ไข\n\n",
  "changelog": "# Changelog\n\n## [v14.6.3-modal-close-policy]\n- ปรับ Modal ทั้งระบบเป็น Explicit Close Only: click backdrop ไม่ปิดหน้าต่างอีกต่อไป\n- Edit Row ปิดด้วย `×` หรือ `ยกเลิก`; File/Media Preview และ Development Production Bundle modal ปิดด้วย `×`\n- เพิ่ม `data-modal-close`, `aria-label`, `role=dialog`, `aria-modal=true` และ click target ของปุ่มปิดให้สม่ำเสมอ\n- เพิ่ม `closeActiveModal()` เพื่อให้การแทน modal เดิมเรียก close handler/cleanup ก่อน แทนการ `.remove()` โดยตรง\n- ตรวจยืนยันว่า Production v14.6.2+ ต้องมี `js/login-view.js`; Live Extracted list ที่ไม่มีไฟล์นี้คือ source/cache รุ่นก่อน\n- Frozen baseline ยังคง `v14.6.1-auth-compatibility`; รุ่นนี้เป็น Candidate ต่อจาก baseline เดิม\n\n## [v14.6.2-auth-polish]\n- Freeze baseline ก่อนหน้าเป็น `v14.6.1-auth-compatibility` หลังพิสูจน์ Login cross-document + persistence ผ่าน UI จริง\n- แยก Login presentation/submit orchestration เป็น Production module `js/login-view.js`; `json-form-view.js` กลับไปเน้น generic JSON Form create/persist\n- เพิ่ม auth-source guard สำหรับ Email ซ้ำแบบ case-insensitive: `inspectAuthSource()` คืน `duplicate-email` และ Login ปฏิเสธ source แทนการเลือก user แรก\n- คง schema `screen + fields + data`, PBKDF2, Login history, text-storage flow และกฎไม่ใช้ IndexedDB ใน Login/Users ตามเดิม\n\n## [v14.6.1-auth-compatibility] — FROZEN\n- เพิ่ม Users Auth Compatibility Check สำหรับ `login.json` โดยไม่ auto-migrate credential\n- เพิ่ม `JSONFormModel.inspectAuthSource()` ตรวจ `email` / Password field และสรุปจำนวน user ที่ตั้ง password แล้ว\n- Login แยก reason ชัดเจน: source missing/ambiguous/invalid, legacy password field missing, password field invalid, inactive account, password not configured, Web Crypto unavailable และ credentials rejected\n- Login UI แสดง Auth status ของ `users.json` ก่อน submit เพื่อรู้ทันทีว่า Source พร้อมหรือยัง\n- `＋ Password` บน Users รุ่นเก่าจะสร้าง canonical field id `password` เมื่อยังไม่มี เพื่อให้ Login compatibility check ใช้งานได้ตรงกัน\n- `users.json` รุ่นเก่ายังคงเป็น user-owned document; system docs sync ไม่แตะ schema/data และผู้ใช้ต้องตั้ง Password เองอย่างตั้งใจ\n- คงกฎ Login/Users ไม่ใช้ IndexedDB; IndexedDB ยังจำกัดเฉพาะ File/Media binary fallback\n- Freeze หลังทดสอบ UI จริง: inactive user ถูกปฏิเสธ, แก้ Users แล้ว persist, Login ข้าม `users.json` สำเร็จ และ `login.json` บันทึก history ด้วย `loginRecordId=1`\n\n## [v14.6.0-login-cross-document]\n- เพิ่ม Login template เป็น Action Screen โดยใช้ `screen.action: login` และ `screen.source: users.json`\n- Login อ่าน `users.json` ข้าม document ผ่าน WorkspaceStateStore และ verify PBKDF2 hash ด้วย `JSONFormModel.verifyPassword()`\n- ไม่ persist credential ใน `login.json`; บันทึกเฉพาะ Login history `{ id, userId, email, name, role, loginAt }` เมื่อ login สำเร็จ\n- Failed login ไม่สร้าง record และ AUTH log ไม่บันทึก password/hash/salt\n- Login/Users cross-document flow ใช้ text JSON persistence ผ่าน OPFS/LocalStorage fallback และไม่เรียก IndexedDB; IndexedDB ยังคงจำกัดเฉพาะ File/Media binary fallback\n- Freeze baseline ก่อนหน้าเป็น `v14.5.0-users-password-hash`\n\n## [v14.5.0-users-password-hash]\n- เพิ่ม Password ให้ Users template โดยใช้ `type: input` + `inputType: password` ภายใน schema เดิม\n- เพิ่ม Web Crypto `PBKDF2-SHA256` + random salt 16 bytes + 120000 iterations; `users.json` เก็บเฉพาะ algorithm/iterations/salt/hash ไม่เก็บ plaintext\n- เพิ่ม `JSONFormModel.hashPassword()` / `verifyPassword()` / password record validation และ default `null`\n- Rows แสดง password เป็น `••••••••`; Edit เว้นว่างจะคง hash เดิมและกรอกใหม่จะสร้าง salt/hash ใหม่\n- เพิ่ม Password ใน Properties/Add Component และ validation ของ supported input types\n- Redact password ใน FORM success log เป็น `[HASHED]`; ยังคง Data JSON ให้ตรวจสอบโครงสร้าง hash ได้\n- ระบุชัดว่าเป็น client-side authentication simulation ไม่ใช่ production authentication backend\n\n## [v14.4.3-freeze-polish]\n- เปลี่ยน `JSONFormModel.getNextId()` เป็น loop หา max เพื่อรองรับข้อมูลจำนวนมากโดยไม่ชน JavaScript argument limit จาก `Math.max(...spread)`\n- `addJSONFormField()` ใช้ `JSONFormModel.defaultValue(field)` เป็นกฎกลาง ทำให้ Number/Date ของ records เดิมเป็น `null` ตาม invariant\n- เปลี่ยน Fields JSON จาก auto-apply debounce เป็น draft + schema-only validation + ปุ่ม `✓ Apply Fields`; ไม่ iterate/migrate `data[]` ระหว่างพิมพ์ และ structural migration/file cleanup จะเกิดหลังผู้ใช้ยืนยัน Apply เท่านั้น\n- คง schema, CRUD, File/Media lifecycle และ module ownership เดิม; รอบนี้เป็น polish ก่อน freeze โดยไม่เพิ่ม feature ใหม่\n\n## [v14.4.2-correctness-hardening]\n- เพิ่ม schema validation กลางใน `JSONFormModel`: Field ID ต้อง unique/non-empty, PK ต้องเป็น `id` field แรก, reject unsupported field/input type และ non-PK autoIncrement\n- Fields JSON editor ใช้ validation/migration เดียวกับ Properties พร้อม debounce 450ms; raw edit จะ migrate data และคืน PK ก่อน persist\n- ยกเลิก `setTimeout(500)` สำหรับ file type conversion; เปลี่ยนเป็น persist สำเร็จก่อน cleanup binary\n- เพิ่ม `removeBlob/listBlobs` และ cleanup partial OPFS write ก่อน IndexedDB fallback\n- `FileAssetStore` รายงาน `FS warn` เมื่อ binary cleanup ไม่ครบ แทนการกลืน error เงียบ\n- Escape filename/doc id ใน TopNav/Explorer/Tabs ก่อน render ผ่าน `innerHTML`\n- Date ว่าง normalize เป็น `null`; Checkbox เป็น boolean และไม่ใช้ HTML required บังคับ checked\n- อัปเดต system docs และ Production extractor/imports ให้ตรงกับ correctness rules ล่าสุด\n\n## [v14.4.1-file-storage-fallback]\n- แก้ File/Image/Video upload ล้มเหลวเมื่อ browser ปฏิเสธ OPFS ด้วย `SecurityError`\n- เพิ่ม IndexedDB Blob Store เป็น binary fallback หลัง OPFS โดยไม่ใช้ LocalStorage เก็บ binary\n- `readBlob/remove/list` รองรับ asset จากทั้ง OPFS และ IndexedDB\n\n## [v14.4.0-basic-screen-file]\n- เพิ่ม Basic Screen Templates: Users, Files, Images, Videos\n- เพิ่ม field `file` โดยใช้ `accept` สำหรับ file/image/video\n- เพิ่ม Upload/Download/Preview และ FileAssetStore; JSON เก็บเฉพาะ metadata\n\n## [v14.3.0-modular-cleanup]\n- ย้าย Row Delete ไป `rows-crud-view.js` และแยก `system-docs.js` จาก `store.js`\n- ลบ unused imports และซ่อน Deploy ใน Production\n\n## [v14.2.0-json-form-layout-docsync]\n- JSON Form กรอบหลัก 1 ชั้น, Label ซ้าย | Component ขวา, scroll เฉพาะ content region\n\n## [v14.1.0-modular-json-form-crud]\n- เพิ่ม schema `screen + fields + data`, PK auto increment, Data/Rows pagination และ CRUD\n"
