      const createSystemProjects = () => {
        const now = new Date().toISOString();
        return [
          {
            id: 'doc_index', filename: 'index.md', category: 'Architecture', kind: 'markdown',
            systemManaged: true, docVersion: SYSTEM_DOC_VERSION, description: SYSTEM_DOC_CONTENT.index, updatedAt: now
          },
          {
            id: 'doc_handoff', filename: 'handoff.md', category: 'Guidelines', kind: 'markdown',
            systemManaged: true, docVersion: SYSTEM_DOC_VERSION, description: SYSTEM_DOC_CONTENT.handoff, updatedAt: now
          },
          {
            id: 'doc_changelog', filename: 'Changelog.md', category: 'Documentation', kind: 'markdown',
            systemManaged: true, docVersion: SYSTEM_DOC_VERSION, description: SYSTEM_DOC_CONTENT.changelog, updatedAt: now
          }
        ];
      };

      const syncSystemProjects = (projects = []) => {
        const systemDocs = createSystemProjects();
        const systemById = new Map(systemDocs.map(doc => [doc.id, doc]));
        let changed = false;
        const merged = projects.map(project => {
          const systemDoc = systemById.get(project.id);
          if (!systemDoc) return project;
          systemById.delete(project.id);
          if (project.systemManaged === true && project.docVersion === SYSTEM_DOC_VERSION) return project;
          changed = true;
          return { ...project, ...systemDoc };
        });
        for (const systemDoc of systemById.values()) {
          merged.push(systemDoc);
          changed = true;
        }
        return { projects: merged, changed };
      };

      class WorkspaceStateStore {
        #subscribers = new Set();
        #saveTimer = null;

        constructor() {
          this.projects = createSystemProjects();
          this.openTabIds = ['doc_index', 'doc_handoff', 'doc_changelog'];
          this.activeId = 'doc_index';

          this.#initStorage();
        }

        async #initStorage() {
          try {
            const rawIndex = await window.FS?.read(INDEX_FILE);
            if (rawIndex) {
              const meta = JSON.parse(rawIndex);
              if (meta?.projects?.length) {
                const loadedProjects = await Promise.all(
                  meta.projects.map(async (p) => {
                    const content = await window.FS?.read(this.getStoragePath(p));
                    return {
                      ...p,
                      description: content !== null ? content : (p.description || '')
                    };
                  })
                );
                const synced = syncSystemProjects(loadedProjects);
                this.projects = synced.projects;
                this.openTabIds = meta.openTabIds || this.openTabIds;
                this.activeId = meta.activeId || this.activeId;
                if (synced.changed) {
                  await Promise.all(
                    this.projects
                      .filter(doc => doc.systemManaged)
                      .map(doc => this.saveDocContent(doc))
                  );
                  await this.saveIndex();
                  window.Logger?.log('STORE', 'info', `System docs synchronized to ${SYSTEM_DOC_VERSION}`, {
                    reason: 'system-doc-sync'
                  });
                }
                this.notify({ type: 'STORAGE_LOADED' });
                window.Logger?.log('STORE', 'success', `Loaded ${this.projects.length} docs from disk (1 Doc = 1 File)`);
                return;
              }
            }
            await this.saveIndex();
            await Promise.all(this.projects.map(p => this.saveDocContent(p)));
            window.Logger?.log('STORE', 'success', 'Initialized default session (1 Doc = 1 File)');
          } catch (err) {
            window.Logger?.log('STORE', 'info', 'Initialized default session', { detail: err.message });
          }
        }

        subscribe(cb) {
          this.#subscribers.add(cb);
          return () => this.#subscribers.delete(cb);
        }

        notify(event) {
          this.#subscribers.forEach(cb => cb(event));
        }

        async saveIndex() {
          const metaPayload = JSON.stringify({
            projects: this.projects.map(p => ({
              id: p.id,
              filename: p.filename,
              category: p.category,
              kind: p.kind || 'markdown',
              systemManaged: p.systemManaged === true,
              docVersion: p.docVersion || null,
              updatedAt: p.updatedAt
            })),
            openTabIds: this.openTabIds,
            activeId: this.activeId
          });
          await window.FS?.write(INDEX_FILE, metaPayload);
        }

        getStoragePath(doc) {
          const extension = doc?.kind === 'json-form' ? 'json' : 'md';
          return `${doc.id}.${extension}`;
        }

        async saveDocContent(doc) {
          if (!doc) return;
          await window.FS?.write(this.getStoragePath(doc), doc.description || '');
        }

        async saveActive(syncImmediate = false, reason = 'autosave') {
          const active = this.getActive();
          if (!active) return false;
          try {
            await Promise.all([
              this.saveDocContent(active),
              this.saveIndex()
            ]);
            window.Logger?.log('STORE', 'info', `Saved [${active.filename}] to disk`, {
              reason,
              document: active.filename
            });
            return true;
          } catch (e) {
            window.Logger?.log('STORE', 'error', `Write failed [${active.filename}]`, {
              reason,
              document: active.filename,
              error: e.message
            });
            return false;
          }
        }

        getActive() {
          return this.projects.find(p => p.id === this.activeId) || null;
        }

        select(id) {
          if (this.activeId === id) return;
          if (!this.projects.some(p => p.id === id)) return;
          if (!this.openTabIds.includes(id)) this.openTabIds.push(id);
          this.activeId = id;
          this.saveIndex();
          window.Logger?.log('WORKSPACE', 'info', `Swapped view to: [${id}]`);
          this.notify({ type: 'SELECT_DOC', id });
        }

        closeTab(id) {
          if (!this.openTabIds.includes(id)) return;
          const idx = this.openTabIds.indexOf(id);
          this.openTabIds = this.openTabIds.filter(t => t !== id);
          if (this.activeId === id) {
            this.activeId = this.openTabIds.length > 0
              ? this.openTabIds[Math.min(idx, this.openTabIds.length - 1)]
              : null;
          }
          this.saveIndex();
          window.Logger?.log('WORKSPACE', 'info', `Closed tab: [${id}]`);
          this.notify({ type: 'CLOSE_TAB', id });
        }

        async createFile() {
          let count = 1;
          const names = new Set(this.projects.map(p => p.filename));
          while (names.has(`เอกสาร_${count}.md`)) count++;

          const newDoc = {
            id: `doc_${Date.now()}`,
            filename: `เอกสาร_${count}.md`,
            category: 'ทั่วไป',
            description: `# เอกสาร_${count}.md\n\nเนื้อหาเอกสารเริ่มต้น...`,
            updatedAt: new Date().toISOString()
          };
          this.projects.push(newDoc);
          this.openTabIds.push(newDoc.id);
          this.activeId = newDoc.id;

          await this.saveDocContent(newDoc);
          await this.saveIndex();

          window.Logger?.log('WORKSPACE', 'success', `Created: [${newDoc.filename}]`);
          this.notify({ type: 'CREATE_DOC', doc: newDoc });
        }

        async createJSONForm(templateName = 'users') {
          const templateLabels = { login: 'login', users: 'users', files: 'files', images: 'images', videos: 'videos' };
          const baseName = templateLabels[templateName] || 'users';
          let count = 1;
          const names = new Set(this.projects.map(p => p.filename));
          let filename = `${baseName}.json`;
          while (names.has(filename)) filename = `${baseName}_${++count}.json`;

          const schema = JSONFormModel.createTemplate(templateName);
          const newDoc = {
            id: `doc_${Date.now()}`,
            filename,
            category: 'JSON Form',
            kind: 'json-form',
            description: JSON.stringify(schema, null, 2),
            updatedAt: new Date().toISOString()
          };

          this.projects.push(newDoc);
          this.openTabIds.push(newDoc.id);
          this.activeId = newDoc.id;

          await this.saveDocContent(newDoc);
          await this.saveIndex();

          window.Logger?.log('WORKSPACE', 'success', `Created JSON Form: [${newDoc.filename}]`, { template: templateName });
          this.notify({ type: 'CREATE_DOC', doc: newDoc });
        }

        async deleteFile(id) {
          const target = this.projects.find(p => p.id === id);
          if (!target || !confirm(`ยืนยันการลบไฟล์ "${target.filename}" หรือไม่?`)) return;

          this.projects = this.projects.filter(p => p.id !== id);
          this.closeTab(id);

          await window.FS?.remove(this.getStoragePath(target));
          if (target.kind === 'json-form') await fileAssets.removeDocumentAssets(target.id);
          await this.saveIndex();

          window.Logger?.log('WORKSPACE', 'warn', `Deleted: [${target.filename}]`);
          this.notify({ type: 'DELETE_DOC', id });
        }

        updateActive(patch, syncImmediate = false, reason = 'autosave') {
          const active = this.getActive();
          if (!active) return Promise.resolve(false);

          Object.assign(active, patch);
          active.updatedAt = new Date().toISOString();

          clearTimeout(this.#saveTimer);
          if (syncImmediate) {
            const savePromise = this.saveActive(true, reason);
            this.notify({ type: 'UPDATE_DOC', active });
            return savePromise;
          }

          this.#saveTimer = setTimeout(() => this.saveActive(false, reason), 400);
          this.notify({ type: 'TYPING_DOC', active });
          return Promise.resolve(true);
        }
      }

        showBundleModal() {
          closeActiveModal();

          let prodFiles;
          try {
            prodFiles = this.getLiveProductionFiles();
          } catch (err) {
            window.Logger?.log('BUNDLE', 'warn', 'Bundle extractor unavailable in modular mode', { error: err.message });
            alert('ระบบทำงานในโหมดแยกไฟล์ Production แล้ว ไม่จำเป็นต้องสกัดโค้ดซ้ำ');
            return;
          }

          let currentIdx = 0;
          const overlay = document.createElement('div');
          overlay.className = 'modal-overlay';
          overlay.innerHTML = `
            <div class="modal-box" role="dialog" aria-modal="true" aria-label="Production Code Bundle">
              <div class="modal-header">
                <span style="font-weight:700; font-size:0.85rem; color:#fff;">📦 Production Code Bundle (Modular · Live Extracted)</span>
                <button type="button" class="dock-btn modal-close-btn" id="btn-close-modal" data-modal-close aria-label="ปิดหน้าต่าง" title="ปิด">×</button>
              </div>
              <div class="modal-tabs" id="bundle-tabs">
                ${prodFiles.map((f, i) => `
                  <button class="modal-tab-btn ${i === 0 ? 'active' : ''}" data-idx="${i}">${f.name}</button>
                `).join('')}
              </div>
              <textarea class="modal-code-view" id="bundle-code" readonly spellcheck="false">${prodFiles[0].content}</textarea>
              <div class="modal-footer">
                <span style="font-size:0.75rem; color:var(--text-muted);" id="bundle-file-info">Path: ${prodFiles[0].path}</span>
                <div style="display:flex; gap:8px;">
                  <button class="btn" id="btn-download-file">💾 ดาวน์โหลดไฟล์นี้</button>
                  <button class="btn primary" id="btn-copy-code">📋 Copy Code</button>
                </div>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);

          const codeView = $('#bundle-code', overlay);
          const fileInfo = $('#bundle-file-info', overlay);           const tabs = $$('.modal-tab-btn', overlay);
          const copyBtn = $('#btn-copy-code', overlay);
          const dlBtn = $('#btn-download-file', overlay);

          tabs.forEach(tab => {
            tab.addEventListener('click', () => {
              tabs.forEach(t => t.classList.remove('active'));
              tab.classList.add('active');
              currentIdx = +tab.dataset.idx;
              codeView.value = prodFiles[currentIdx].content;
              fileInfo.textContent = `Path: ${prodFiles[currentIdx].path}`;
            });
          });

          copyBtn.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(codeView.value);
              copyBtn.textContent = '✓ Copied!';
              setTimeout(() => { copyBtn.textContent = '📋 Copy Code'; }, 1500);
              window.Logger?.log('BUNDLE', 'success', `Copied [${prodFiles[currentIdx].name}]`);
            } catch (_) {}
          });

          dlBtn.addEventListener('click', () => {
            const file = prodFiles[currentIdx];
            const blob = new Blob(['\uFEFF' + file.content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = file.name.split('/').pop();
            a.click();
            URL.revokeObjectURL(url);
            window.Logger?.log('BUNDLE', 'success', `Downloaded [${file.name}]`);
          });

          $('#btn-close-modal', overlay).addEventListener('click', () => overlay.remove());
        }

        setupSplitter(splitterEl, onDrag) {
          splitterEl.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return;
            e.preventDefault();
            const startX = e.clientX;
            const startW = splitterEl === this.dom.leftSplitter ? this.leftW : this.rightW;
            splitterEl.setPointerCapture?.(e.pointerId);
            splitterEl.classList.add('is-dragging');

            const move = (ev) => onDrag(ev.clientX - startX, startW);
            const stop = () => {
              splitterEl.classList.remove('is-dragging');
              window.removeEventListener('pointermove', move);
              window.removeEventListener('pointerup', stop);
            };
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', stop);
          });
        }

        toggleDock(side, force) {
          const isLeft = side === 'left';
          const dock = isLeft ? this.dom.leftDock : this.dom.rightDock;
          const splitter = isLeft ? this.dom.leftSplitter : this.dom.rightSplitter;
          const btn = isLeft ? this.dom.btnToggleLeft : this.dom.btnToggleRight;

          const nextState = force ?? (dock.style.display === 'none');
          dock.style.display = nextState ? 'flex' : 'none';
          splitter.style.display = nextState ? 'block' : 'none';
          btn.classList.toggle('active', nextState);
        }

        handleStateChange(evt) {
          if (evt?.type === 'TYPING_DOC' || (evt?.type === 'UPDATE_DOC' && this.isEditingProperties)) {
            if (!this.isEditingProperties) this.renderProperties();
            return;
          }
          this.refreshAll();
        }

        refreshAll() {
          this.renderTopNav();
          this.renderExplorer();
          this.renderTabs();
          this.renderStage();
          this.renderProperties();
        }

        renderTopNav() {
          const active = store.getActive();
          this.dom.chapterSelect.innerHTML = `
            ${!active ? '<option value="" disabled selected>เลือกไฟล์เอกสาร...</option>' : ''}
            ${store.projects.map(p => `
              <option value="${escapeHTML(p.id)}" ${active?.id === p.id ? 'selected' : ''}>${escapeHTML(p.filename)}</option>
            `).join('')}
          `;
        }

        renderExplorer() {
          const active = store.getActive();
          this.dom.fileCounter.textContent = `ไฟล์ทั้งหมด (${store.projects.length})`;
          this.dom.fileList.innerHTML = store.projects.length === 0
            ? '<div style="color:var(--text-muted); font-size:0.75rem; text-align:center; padding:12px;">ไม่มีไฟล์</div>'
            : store.projects.map(p => `
                <div class="card-item ${active?.id === p.id ? 'active' : ''}" data-id="${escapeHTML(p.id)}">
                  <span class="card-title">${p.kind === 'json-form' ? '◫' : '📝'} ${escapeHTML(p.filename)}</span>
                  <button type="button" class="card-del-btn" data-del="${escapeHTML(p.id)}" title="ลบไฟล์นี้">🗑</button>
                </div>
              `).join('');
        }

        renderTabs() {
          const active = store.getActive();
          this.dom.tabStrip.innerHTML = store.openTabIds.map(id => {
            const doc = store.projects.find(d => d.id === id);
            if (!doc) return '';
            return `
              <div class="editor-tab ${active?.id === doc.id ? 'active' : ''}" data-tab="${escapeHTML(doc.id)}">
                <span>${doc.kind === 'json-form' ? '◫' : '📝'} ${escapeHTML(doc.filename)}</span>
                <button type="button" class="tab-close-btn" data-close="${escapeHTML(doc.id)}" title="ปิดแท็บ">×</button>
              </div>
            `;
          }).join('');
        }

        renderStage() {
          const active = store.getActive();
          if (!active) {
            this.dom.stageBody.innerHTML = `
              <div class="stage-empty-box">
                <div class="stage-empty-title">ไม่มีไฟล์ที่เปิดใช้งาน</div>
                <p style="font-size:0.78rem; margin-bottom:14px;">เลือกไฟล์จากแถบซ้าย หรือสร้างเอกสารใหม่</p>
                <button class="btn primary" id="btn-create-empty">＋ สร้างเอกสารใหม่</button>
              </div>
            `;
            $('#btn-create-empty', this.dom.stageBody)?.addEventListener('click', () => store.createFile());
            return;
          }

          if (active.kind === 'json-form') {
            this.renderJSONFormStage(active);
            return;
          }

          this.renderMarkdownStage(active);
        }

        renderMarkdownStage(active) {
          const currentBox = $('.stage-editor-box', this.dom.stageBody);
          if (currentBox?.dataset.activeId === active.id && currentBox?.dataset.kind === 'markdown') return;

          this.dom.stageBody.innerHTML = `
            <div class="stage-editor-box" data-active-id="${active.id}" data-kind="markdown">
              <div class="stage-action-bar">
                <div class="stage-action-bar-left">
                  <label>ชื่อไฟล์</label>
                  <input type="text" id="stage-name-input" value="${escapeHTML(active.filename)}" />
                </div>
                <div class="stage-action-bar-right">
                  <button class="btn primary" id="btn-save-doc">💾 บันทึก</button>
                  <button class="btn" id="btn-export-doc">📤 Export</button>
                  <button class="btn danger" id="btn-del-doc">🗑 ลบ</button>
                </div>
              </div>
              <div class="form-group" style="flex:1; min-height:0; display:flex;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <label>MARKDOWN CONTENT (<span id="stage-cat-label">${escapeHTML(active.category)}</span>)</label>
                  <span id="line-indicator" style="font-size:0.68rem; color:var(--text-muted);">
                    Ln ${(active.description || '').split('\n').length}, Col 1
                  </span>
                </div>
                <textarea id="stage-desc-input" placeholder="// เขียนเนื้อหาไฟล์ที่นี่..." spellcheck="false">${escapeHTML(active.description || '')}</textarea>
              </div>
            </div>
          `;

          const descInput = $('#stage-desc-input', this.dom.stageBody);
          const nameInput = $('#stage-name-input', this.dom.stageBody);
          const lineIndicator = $('#line-indicator', this.dom.stageBody);

          descInput.addEventListener('compositionstart', () => { this.isComposing = true; });
          descInput.addEventListener('compositionend', (e) => {
            this.isComposing = false;
            store.updateActive({ description: e.target.value });
          });

          descInput.addEventListener('input', (e) => {
            lineIndicator.textContent = `Ln ${e.target.value.split('\n').length}, Col 1`;
            if (!this.isComposing) store.updateActive({ description: e.target.value });
          });

          nameInput.addEventListener('input', (e) => store.updateActive({ filename: e.target.value }, false, 'filename-edit'));

          $('#btn-save-doc', this.dom.stageBody).addEventListener('click', async () => {
            const saved = await store.saveActive(true, 'manual-save');
            if (saved) window.Logger?.log('STAGE', 'success', `บันทึก [${active.filename}] สำเร็จ`);
          });

          $('#btn-export-doc', this.dom.stageBody).addEventListener('click', () => exportMarkdown(active.filename, active.description));
          $('#btn-del-doc', this.dom.stageBody).addEventListener('click', () => store.deleteFile(active.id));
        }

        parseJSONForm(active) {
          return JSONFormModel.parse(active?.description || '{}');
        }

        renderJSONFormStage(active, force = false) {
          const mode = this.stageModes.get(active.id) || 'screen';
          const currentBox = $('.stage-editor-box', this.dom.stageBody);
          if (!force && currentBox?.dataset.activeId === active.id && currentBox?.dataset.kind === 'json-form' && currentBox?.dataset.mode === mode) return;

          const { schema, error } = this.parseJSONForm(active);
          const screen = schema?.screen || {};

          this.dom.stageBody.innerHTML = `
            <div class="stage-editor-box" data-active-id="${active.id}" data-kind="json-form" data-mode="${mode}">
              <div class="stage-action-bar">
                <div class="stage-action-bar-left">
                  <label>ชื่อไฟล์</label>
                  <input type="text" id="stage-name-input" value="${escapeHTML(active.filename)}" />
                </div>
                <div class="stage-action-bar-right">
                  <button class="btn primary" id="btn-save-doc">💾 บันทึกไฟล์</button>
                  <button class="btn" id="btn-export-doc">📤 Export JSON</button>
                  <button class="btn danger" id="btn-del-doc">🗑 ลบ</button>
                </div>
              </div>

              <div class="content-tab-bar">
                <button class="content-tab-btn ${mode === 'screen' ? 'active' : ''}" data-form-mode="screen">1. หน้าจอ</button>
                <button class="content-tab-btn ${mode === 'json' ? 'active' : ''}" data-form-mode="json">2. JSON Property · Fields</button>
                <button class="content-tab-btn ${mode === 'output' ? 'active' : ''}" data-form-mode="output">3. JSON OUTPUT · Data</button>
                <button class="content-tab-btn ${mode === 'rows' ? 'active' : ''}" data-form-mode="rows">4. Rows · CRUD</button>
              </div>

              ${mode === 'screen'
                ? this.getJSONFormScreenHTML(active, schema, error)
                : mode === 'json'
                  ? this.getJSONSourceHTML(active)
                  : mode === 'output'
                    ? this.getJSONOutputHTML(active, schema, error)
                    : this.getRowsTableHTML(active, schema, error)}
            </div>
          `;

          $$('[data-form-mode]', this.dom.stageBody).forEach(btn => {
            btn.addEventListener('click', () => {
              this.stageModes.set(active.id, btn.dataset.formMode);
              this.renderJSONFormStage(active);
              this.renderProperties();
            });
          });

          $('#stage-name-input', this.dom.stageBody)?.addEventListener('input', (e) => store.updateActive({ filename: e.target.value }, false, 'filename-edit'));
          $('#btn-save-doc', this.dom.stageBody)?.addEventListener('click', () => store.saveActive(true, 'manual-save'));
          $('#btn-export-doc', this.dom.stageBody)?.addEventListener('click', () => exportJSON(active.filename, active.description));
          $('#btn-del-doc', this.dom.stageBody)?.addEventListener('click', () => store.deleteFile(active.id));

          if (mode === 'screen') this.bindJSONFormScreen(active, schema, error);
          else if (mode === 'json') this.bindJSONSourceEditor(active);
          else if (mode === 'output') this.bindJSONOutput(active, schema, error);
          else this.bindRowsTable(active, schema, error);
        }

        getJSONFormScreenHTML(active, schema, error) {
          if (error || !schema) {
            return `
              <div class="json-invalid">
                JSON ไม่ถูกต้อง: ${escapeHTML(error?.message || 'Unknown error')}<br><br>
                เปิด Tab <b>JSON Property</b> เพื่อแก้ไข source
              </div>
            `;
          }

          const screen = schema.screen || {};
          if (screen.action === 'login') return this.getLoginScreenHTML(active, schema);
          const fields = schema.fields || [];
          const rows = Array.isArray(schema.data) ? schema.data : [];
          const nextId = this.getNextAutoIncrementId(schema);

          const fieldHTML = fields.map((field) => {
            if (field.type === 'autoIncrement' || field.id === 'id') return '';

            const id = escapeHTML(field.id || '');
            const label = escapeHTML(field.label || field.id || 'Field');
            const placeholder = escapeHTML(field.placeholder || '');
            const required = field.required && field.type !== 'checkbox' ? 'required' : '';

            if (field.type === 'textarea') {
              const textareaRows = Number.isFinite(+field.rows) ? Math.max(2, Math.min(20, +field.rows)) : 5;
              return `
                <div class="json-form-field">
                  <label for="form-${id}">${label}${field.required ? ' *' : ''}</label>
                  <textarea id="form-${id}" data-form-key="${id}" data-form-type="textarea" rows="${textareaRows}" placeholder="${placeholder}" ${required}></textarea>
                </div>
              `;
            }

            if (field.type === 'select') {
              const options = Array.isArray(field.options) ? field.options : [];
              return `
                <div class="json-form-field">
                  <label for="form-${id}">${label}${field.required ? ' *' : ''}</label>
                  <select id="form-${id}" data-form-key="${id}" data-form-type="select" ${required}>
                    ${options.map(option => {
                      const optionValue = String(option);
                      return `<option value="${escapeHTML(optionValue)}">${escapeHTML(optionValue)}</option>`;
                    }).join('')}
                  </select>
                </div>
              `;
            }

            if (field.type === 'checkbox') {
              return `
                <div class="json-form-field json-form-check">
                  <label for="form-${id}">${label}</label>
                  <div class="json-form-checkbox-control">
                    <input id="form-${id}" data-form-key="${id}" data-form-type="checkbox" type="checkbox" ${required} />
                  </div>
                </div>
              `;
            }

            if (field.type === 'file') {
              const accept = escapeHTML(field.accept || '*/*');
              return `
                <div class="json-form-field">
                  <label for="form-${id}">${label}${field.required ? ' *' : ''}</label>
                  <div class="json-file-control">
                    <input id="form-${id}" data-form-key="${id}" data-form-type="file" type="file" accept="${accept}" ${required} />
                  </div>
                </div>
              `;
            }

            const inputType = escapeHTML(field.inputType || 'text');
            const autocomplete = field.inputType === 'password' ? 'autocomplete="new-password"' : '';
            return `
              <div class="json-form-field">
                <label for="form-${id}">${label}${field.required ? ' *' : ''}</label>
                <input id="form-${id}" data-form-key="${id}" data-form-type="input" type="${inputType}" value="" placeholder="${placeholder}" ${autocomplete} ${required} />
              </div>
            `;
          }).join('');

          return `
            <div class="json-form-screen">
              <div class="json-form-card">
                <div class="json-form-title">${escapeHTML(screen.title || active.filename)}</div>
                <div class="json-form-desc">${escapeHTML(screen.description || '')}</div>
                <div class="db-meta-row">
                  <span>PK: <b>id</b></span>
                  <span>Next ID: <b>${nextId}</b></span>
                  <span>Rows: <b>${rows.length}</b></span>
                </div>
                <form id="generated-json-form">
                  ${fieldHTML || '<div class="stage-empty-title">ยังไม่มี field สำหรับกรอกข้อมูล</div>'}
                  <div class="json-form-actions">
                    <button class="btn primary" type="submit">💾 ${escapeHTML(screen.submitLabel || 'บันทึกข้อมูล')}</button>
                  </div>
                </form>
                <div id="form-save-status" class="form-save-status"></div>
              </div>
            </div>
          `;
        }

        getLoginScreenHTML(active, schema) {
          const screen = schema?.screen || {};
          const sourceName = String(screen.source || 'users.json');
          const rows = Array.isArray(schema?.data) ? schema.data : [];
          const sourceDocs = store.projects.filter(doc =>
            doc.kind === 'json-form' &&
            doc.id !== active.id &&
            String(doc.filename || '').toLowerCase() === sourceName.toLowerCase()
          );

          let authStatus = 'ไม่พบ Source';
          if (sourceDocs.length > 1) {
            authStatus = 'Source ชื่อซ้ำ';
          } else if (sourceDocs.length === 1) {
            const sourceResult = JSONFormModel.parse(sourceDocs[0].description || '{}');
            if (sourceResult.error || !sourceResult.schema) {
              authStatus = 'Source JSON ไม่ถูกต้อง';
            } else {
              const compatibility = JSONFormModel.inspectAuthSource(sourceResult.schema);
              if (!compatibility.ok) {
                const labels = {
                  'email-field-missing': 'ขาด Email field',
                  'legacy-password-field-missing': 'Users รุ่นเก่า · ขาด Password',
                  'password-field-invalid': 'Password field ไม่ถูกต้อง',
                  'duplicate-email': 'Email ซ้ำใน Users'
                };
                authStatus = labels[compatibility.reason] || 'ต้องตั้งค่า Users';
              } else if (compatibility.unconfiguredUsers > 0) {
                authStatus = `พร้อมบางส่วน ${compatibility.configuredUsers}/${compatibility.totalUsers}`;
              } else {
                authStatus = `พร้อม ${compatibility.configuredUsers}/${compatibility.totalUsers}`;
              }
            }
          }

          return `
            <div class="json-form-screen">
              <div class="json-form-card">
                <div class="json-form-title">${escapeHTML(screen.title || 'Login')}</div>
                <div class="json-form-desc">${escapeHTML(screen.description || '')}</div>
                <div class="db-meta-row">
                  <span>Source: <b>${escapeHTML(sourceName)}</b></span>
                  <span>Auth: <b>${escapeHTML(authStatus)}</b></span>
                  <span>Login history: <b>${rows.length}</b></span>
                </div>
                <form id="generated-login-form">
                  <div class="json-form-field">
                    <label for="login-email">Email *</label>
                    <input id="login-email" type="email" autocomplete="username" placeholder="user@example.com" required />
                  </div>
                  <div class="json-form-field">
                    <label for="login-password">รหัสผ่าน *</label>
                    <input id="login-password" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" required />
                  </div>
                  <div class="json-form-actions">
                    <button class="btn primary" type="submit">🔐 ${escapeHTML(screen.submitLabel || 'เข้าสู่ระบบ')}</button>
                  </div>
                </form>
                <div id="form-save-status" class="form-save-status"></div>
              </div>
            </div>
          `;
        }

        bindLoginScreen(active, schema, error) {
          if (error || !schema) return;
          const form = $('#generated-login-form', this.dom.stageBody);
          const status = $('#form-save-status', this.dom.stageBody);
          if (!form) return;

          form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!form.reportValidity()) return;

            const email = String($('#login-email', form)?.value || '').trim();
            const password = String($('#login-password', form)?.value || '');
            const sourceName = String(schema.screen?.source || 'users.json').trim() || 'users.json';
            const sourceDocs = store.projects.filter(doc =>
              doc.kind === 'json-form' &&
              doc.id !== active.id &&
              String(doc.filename || '').toLowerCase() === sourceName.toLowerCase()
            );

            const fail = (message, meta = {}) => {
              if (status) status.textContent = message;
              window.Logger?.log('AUTH', 'warn', `Login failed [${active.filename}]`, { source: sourceName, ...meta });
            };

            if (sourceDocs.length === 0) {
              fail(`ไม่พบ ${sourceName}`, { reason: 'source-not-found' });
              return;
            }
            if (sourceDocs.length > 1) {
              fail(`พบ ${sourceName} มากกว่า 1 เอกสาร กรุณาใช้ชื่อไม่ซ้ำ`, { reason: 'source-ambiguous', matches: sourceDocs.length });
              return;
            }

            const sourceDoc = sourceDocs[0];
            const sourceResult = JSONFormModel.parse(sourceDoc.description || '{}');
            if (sourceResult.error || !sourceResult.schema) {
              fail(`${sourceName} ไม่ถูกต้อง`, { reason: 'source-invalid' });
              return;
            }

            const compatibility = JSONFormModel.inspectAuthSource(sourceResult.schema);
            if (!compatibility.ok) {
              if (compatibility.reason === 'legacy-password-field-missing') {
                fail(`${sourceName} เป็น Users รุ่นเก่าและยังไม่มี Password field · เพิ่ม Password แล้วตั้งรหัสผ่านให้ผู้ใช้ก่อน`, {
                  reason: compatibility.reason,
                  totalUsers: compatibility.totalUsers
                });
                return;
              }
              if (compatibility.reason === 'password-field-invalid') {
                fail(`Password field ใน ${sourceName} ต้องเป็น Input / Password`, { reason: compatibility.reason });
                return;
              }
              if (compatibility.reason === 'email-field-missing') {
                fail(`${sourceName} ไม่มี Email field สำหรับ Login`, { reason: compatibility.reason });
                return;
              }
              if (compatibility.reason === 'duplicate-email') {
                fail(`${sourceName} มี Email ซ้ำ กรุณาแก้ Users ให้ Email ไม่ซ้ำก่อน Login`, {
                  reason: compatibility.reason,
                  duplicateEmailCount: compatibility.duplicateEmailCount || 0
                });
                return;
              }
              fail(`${sourceName} ยังไม่พร้อมสำหรับ Login`, { reason: compatibility.reason || 'auth-source-incompatible' });
              return;
            }

            const normalizedEmail = email.toLowerCase();
            const user = (sourceResult.schema.data || []).find(row =>
              String(row?.email || '').trim().toLowerCase() === normalizedEmail
            );
            if (!user) {
              fail('Email หรือรหัสผ่านไม่ถูกต้อง', { reason: 'credentials-rejected' });
              return;
            }
            if (Object.hasOwn(user, 'active') && user.active === false) {
              fail('บัญชีนี้ถูกปิดใช้งาน', { reason: 'account-inactive', userId: user.id });
              return;
            }
            if (!JSONFormModel.isPasswordRecord(user.password)) {
              fail('บัญชีนี้ยังไม่ได้ตั้งรหัสผ่าน · เปิด Users แล้วกำหนด Password ก่อน', {
                reason: 'password-not-configured',
                userId: user.id
              });
              return;
            }
            if (!globalThis.crypto?.subtle) {
              fail('Browser นี้ไม่รองรับ Web Crypto สำหรับตรวจรหัสผ่าน', { reason: 'web-crypto-unavailable' });
              return;
            }

            const verified = await JSONFormModel.verifyPassword(password, user.password);
            if (!verified) {
              fail('Email หรือรหัสผ่านไม่ถูกต้อง', { reason: 'credentials-rejected', userId: user.id });
              return;
            }

            const latestResult = this.parseJSONForm(active);
            if (latestResult.error || !latestResult.schema || latestResult.schema.screen?.action !== 'login') {
              fail('login.json ไม่พร้อมบันทึก', { reason: 'login-schema-invalid' });
              return;
            }

            const latest = latestResult.schema;
            const id = JSONFormModel.getNextId(latest);
            const loginRecord = {
              id,
              userId: Number(user.id),
              email: String(user.email || email),
              name: String(user.name || ''),
              role: String(user.role || ''),
              loginAt: new Date().toISOString()
            };
            latest.data.push(loginRecord);

            const saved = await this.persistJSONForm(active, latest, 'login-success');
            if (!saved) {
              if (status) status.textContent = 'ยืนยันตัวตนสำเร็จ แต่บันทึก Login history ไม่สำเร็จ';
              window.Logger?.log('AUTH', 'error', `Login history save failed [${active.filename}]`, { source: sourceName, userId: user.id });
              return;
            }

            form.reset();
            const successMessage = `เข้าสู่ระบบสำเร็จ · ${user.name || user.email}${user.role ? ` · ${user.role}` : ''}`;
            window.Logger?.log('AUTH', 'success', `Login succeeded [${active.filename}] via [${sourceName}]`, {
              userId: user.id,
              email: user.email,
              role: user.role || null,
              loginRecordId: id
            });
            this.renderJSONFormStage(active, true);
            const refreshedStatus = $('#form-save-status', this.dom.stageBody);
            if (refreshedStatus) refreshedStatus.textContent = successMessage;
          });
        }

        async collectJSONFormValues(form, schema, context = {}) {
          const fieldMap = new Map((schema?.fields || []).map(field => [field.id, field]));
          const values = {};
          const uploaded = [];
          try {
            for (const input of $$('[data-form-key]', form)) {
              const key = input.dataset.formKey;
              if (!key) continue;
              const field = fieldMap.get(key);
              if (field?.type === 'file' || input.dataset.formType === 'file') {
                const selectedFile = input.files?.[0] || null;
                if (selectedFile) {
                  const meta = await fileAssets.save(context.active?.id || 'doc', context.recordId, key, selectedFile);
                  uploaded.push(meta);
                  values[key] = meta;
                } else {
                  values[key] = context.previousRow?.[key] ?? null;
                }
                continue;
              }
              if (JSONFormModel.isPasswordField(field)) {
                const plain = String(input.value || '');
                if (plain) {
                  values[key] = await JSONFormModel.hashPassword(plain);
                } else {
                  const existing = context.previousRow?.[key];
                  values[key] = JSONFormModel.isPasswordRecord(existing) ? existing : null;
                }
                continue;
              }
              const rawValue = input.dataset.formType === 'checkbox' ? input.checked : input.value;
              values[key] = JSONFormModel.normalizeValue(field, rawValue);
            }
            return { values, uploaded };
          } catch (error) {
            await fileAssets.removeMany(uploaded, 'upload-rollback');
            throw error;
          }
        }

        getNextAutoIncrementId(schema) {
          return JSONFormModel.getNextId(schema);
        }

        async persistJSONForm(active, schema, reason) {
          const previousDescription = active.description;
          const previousUpdatedAt = active.updatedAt;
          const saved = await store.updateActive(
            { description: JSON.stringify(schema, null, 2) },
            true,
            reason
          );

          if (!saved) {
            active.description = previousDescription;
            active.updatedAt = previousUpdatedAt;
            store.notify({ type: 'UPDATE_DOC', active });
          }
          return saved;
        }

        bindJSONFormScreen(active, schema, error) {
          if (error || !schema) return;
          if (schema.screen?.action === 'login') {
            this.bindLoginScreen(active, schema, error);
            return;
          }
          const form = $('#generated-json-form', this.dom.stageBody);
          const status = $('#form-save-status', this.dom.stageBody);
          if (!form) return;

          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!form.reportValidity()) return;

            const { schema: nextSchema, error: parseError } = this.parseJSONForm(active);
            if (parseError || !nextSchema) return;

            const id = this.getNextAutoIncrementId(nextSchema);
            let collected;
            try {
              collected = await this.collectJSONFormValues(form, nextSchema, { active, recordId: id });
            } catch (uploadError) {
              if (status) status.textContent = 'ประมวลผลข้อมูลไม่สำเร็จ';
              window.Logger?.log('FORM', 'error', `Form value processing failed [${active.filename}]`, { name: uploadError?.name, error: uploadError?.message, opfsError: uploadError?.opfsError?.name || null, fallbackError: uploadError?.fallbackError?.name || null });
              return;
            }
            const record = { id, ...collected.values };
            nextSchema.data.push(record);

            const saved = await this.persistJSONForm(active, nextSchema, 'insert');
            if (!saved) {
              await fileAssets.removeMany(collected.uploaded, 'insert-rollback');
              if (status) status.textContent = 'บันทึกไม่สำเร็จ กรุณาลองใหม่';
              return;
            }

            form.reset();
            if (status) status.textContent = `บันทึกสำเร็จ id = ${id}`;
            const logRecord = { ...record };
            (nextSchema.fields || []).forEach(field => {
              if (JSONFormModel.isPasswordField(field) && Object.hasOwn(logRecord, field.id)) {
                logRecord[field.id] = '[HASHED]';
              }
            });
            window.Logger?.log('FORM', 'success', `Inserted record [${active.filename}] id=${id}`, logRecord);
          });
        }

        getJSONOutputHTML(active, schema, error) {
          if (error || !schema) {
            return `<div class="json-invalid">JSON ไม่ถูกต้อง: ${escapeHTML(error?.message || 'Unknown error')}</div>`;
          }

          const rows = Array.isArray(schema.data) ? schema.data : [];
          const pageSize = 100;
          const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
          const requestedPage = this.dataPages.get(active.id) || 1;
          const page = Math.min(totalPages, Math.max(1, requestedPage));
          this.dataPages.set(active.id, page);

          const startIndex = (page - 1) * pageSize;
          const endIndex = Math.min(rows.length, startIndex + pageSize);
          const preview = { data: rows.slice(startIndex, endIndex) };
          const rangeText = rows.length ? `${startIndex + 1}-${endIndex} / ${rows.length}` : '0 / 0';

          return `
            <div class="form-group json-output-tab" style="flex:1; min-height:0; display:flex;">
              <div class="json-output-toolbar">
                <div class="json-output-toolbar-left">
                  <label>DATA JSON</label>
                  <span class="json-page-info">แสดง ${rangeText} · 100 rows/หน้า</span>
                </div>
                <div class="json-output-toolbar-right">
                  <button class="btn json-page-btn" id="btn-data-first" ${page <= 1 ? 'disabled' : ''}>⏮</button>
                  <button class="btn json-page-btn" id="btn-data-prev" ${page <= 1 ? 'disabled' : ''}>◀</button>
                  <span class="json-page-info">หน้า ${page}/${totalPages}</span>
                  <button class="btn json-page-btn" id="btn-data-next" ${page >= totalPages ? 'disabled' : ''}>▶</button>
                  <button class="btn json-page-btn" id="btn-data-last" ${page >= totalPages ? 'disabled' : ''}>⏭</button>
                  <button class="btn" id="btn-copy-json-output">📋 Copy JSON</button>
                </div>
              </div>
              <textarea id="json-output-records" readonly spellcheck="false">${escapeHTML(JSON.stringify(preview, null, 2))}</textarea>
            </div>
          `;
        }

        bindJSONOutput(active, schema, error) {
          if (error || !schema) return;
          const rows = Array.isArray(schema.data) ? schema.data : [];
          const pageSize = 100;
          const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
          const getPage = () => Math.min(totalPages, Math.max(1, this.dataPages.get(active.id) || 1));
          const setPage = (page) => {
            this.dataPages.set(active.id, Math.min(totalPages, Math.max(1, page)));
            this.renderJSONFormStage(active, true);
          };

          $('#btn-data-first', this.dom.stageBody)?.addEventListener('click', () => setPage(1));
          $('#btn-data-prev', this.dom.stageBody)?.addEventListener('click', () => setPage(getPage() - 1));
          $('#btn-data-next', this.dom.stageBody)?.addEventListener('click', () => setPage(getPage() + 1));
          $('#btn-data-last', this.dom.stageBody)?.addEventListener('click', () => setPage(totalPages));

          $('#btn-copy-json-output', this.dom.stageBody)?.addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            try {
              const json = rows.length > 5000
                ? JSON.stringify({ data: rows })
                : JSON.stringify({ data: rows }, null, 2);
              await navigator.clipboard.writeText(json);
              btn.textContent = '✓ Copied';
              setTimeout(() => { if (btn?.isConnected) btn.textContent = '📋 Copy JSON'; }, 1200);
              window.Logger?.log('FORM', 'success', `Copied data JSON [${active.filename}]`, { rows: rows.length });
            } catch (err) {
              window.Logger?.log('FORM', 'warn', 'Copy data JSON failed; use Export JSON for large datasets', { rows: rows.length, error: err?.message });
            }
          });
        }

        formatRowValue(value, field, row) {
          if (JSONFormModel.isPasswordField(field)) {
            return JSONFormModel.isPasswordRecord(value)
              ? '<span class="row-sensitive">••••••••</span>'
              : '<span class="row-null">—</span>';
          }
          if (field?.type === 'file') {
            if (!value?.path) return '<span class="row-null">—</span>';
            const fileName = escapeHTML(value.name || 'file');
            const mimeType = String(value.mimeType || '');
            const canPreview = mimeType.startsWith('image/') || mimeType.startsWith('video/');
            return `<span class="row-file-actions"><span class="row-file-name" title="${fileName}">${fileName}</span>${canPreview ? `<button type="button" class="btn row-file-btn" data-file-preview-row="${escapeHTML(row?.id)}" data-file-field="${escapeHTML(field.id)}">เปิด</button>` : ''}<button type="button" class="btn row-file-btn" data-file-download-row="${escapeHTML(row?.id)}" data-file-field="${escapeHTML(field.id)}">⬇</button></span>`;
          }
          if (value === null || value === undefined || value === '') {
            return '<span class="row-null">—</span>';
          }
          if (typeof value === 'boolean') return value ? 'true' : 'false';
          const text = typeof value === 'object' ? JSON.stringify(value) : String(value);
          const short = text.length > 120 ? `${text.slice(0, 117)}...` : text;
          return escapeHTML(short);
        }

        getRowsTableHTML(active, schema, error) {
          if (error || !schema) {
            return `<div class="json-invalid">JSON ไม่ถูกต้อง: ${escapeHTML(error?.message || 'Unknown error')}</div>`;
          }

          const fields = Array.isArray(schema.fields) ? schema.fields : [];
          const rows = Array.isArray(schema.data) ? schema.data : [];
          const pageSize = 100;
          const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
          const requestedPage = this.dataPages.get(active.id) || 1;
          const page = Math.min(totalPages, Math.max(1, requestedPage));
          this.dataPages.set(active.id, page);

          const startIndex = (page - 1) * pageSize;
          const endIndex = Math.min(rows.length, startIndex + pageSize);
          const pageRows = rows.slice(startIndex, endIndex);
          const rangeText = rows.length ? `${startIndex + 1}-${endIndex} / ${rows.length}` : '0 / 0';

          const headerHTML = fields.map(field => `<th>${escapeHTML(field.label || field.id || '')}</th>`).join('');
          const bodyHTML = pageRows.map(row => `
            <tr>
              ${fields.map(field => `<td class="${field.id === 'id' ? 'row-id' : ''}">${this.formatRowValue(row?.[field.id], field, row)}</td>`).join('')}
              <td class="row-actions">
                <div class="rows-action-group">
                  <button class="btn rows-action-btn" data-row-edit="${escapeHTML(row?.id)}">แก้ไข</button>
                  <button class="btn danger rows-action-btn" data-row-delete="${escapeHTML(row?.id)}">ลบ</button>
                </div>
              </td>
            </tr>
          `).join('');

          return `
            <div class="rows-tab">
              <div class="json-output-toolbar">
                <div class="json-output-toolbar-left">
                  <label>ROWS</label>
                  <span class="json-page-info">แสดง ${rangeText} · 100 rows/หน้า</span>
                </div>
                <div class="json-output-toolbar-right">
                  <button class="btn json-page-btn" id="btn-rows-first" ${page <= 1 ? 'disabled' : ''}>⏮</button>
                  <button class="btn json-page-btn" id="btn-rows-prev" ${page <= 1 ? 'disabled' : ''}>◀</button>
                  <span class="json-page-info">หน้า ${page}/${totalPages}</span>
                  <button class="btn json-page-btn" id="btn-rows-next" ${page >= totalPages ? 'disabled' : ''}>▶</button>
                  <button class="btn json-page-btn" id="btn-rows-last" ${page >= totalPages ? 'disabled' : ''}>⏭</button>
                </div>
              </div>
              <div class="rows-table-wrap">
                <table class="rows-table">
                  <thead><tr>${headerHTML}<th class="row-actions">จัดการ</th></tr></thead>
                  <tbody>${bodyHTML || `<tr><td colspan="${Math.max(1, fields.length + 1)}" class="row-null">ยังไม่มีข้อมูล</td></tr>`}</tbody>
                </table>
              </div>
            </div>
          `;
        }

        bindRowsTable(active, schema, error) {
          if (error || !schema) return;
          const rows = Array.isArray(schema.data) ? schema.data : [];
          const pageSize = 100;
          const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
          const getPage = () => Math.min(totalPages, Math.max(1, this.dataPages.get(active.id) || 1));
          const setPage = (page) => {
            this.dataPages.set(active.id, Math.min(totalPages, Math.max(1, page)));
            this.renderJSONFormStage(active, true);
          };

          $('#btn-rows-first', this.dom.stageBody)?.addEventListener('click', () => setPage(1));
          $('#btn-rows-prev', this.dom.stageBody)?.addEventListener('click', () => setPage(getPage() - 1));
          $('#btn-rows-next', this.dom.stageBody)?.addEventListener('click', () => setPage(getPage() + 1));
          $('#btn-rows-last', this.dom.stageBody)?.addEventListener('click', () => setPage(totalPages));

          $$('[data-row-edit]', this.dom.stageBody).forEach(btn => {
            btn.addEventListener('click', () => this.openRowEditor(active, Number(btn.dataset.rowEdit)));
          });
          $$('[data-row-delete]', this.dom.stageBody).forEach(btn => {
            btn.addEventListener('click', () => this.deleteRow(active, Number(btn.dataset.rowDelete)));
          });
          $$('[data-file-download-row]', this.dom.stageBody).forEach(btn => {
            btn.addEventListener('click', () => this.downloadRowFile(active, Number(btn.dataset.fileDownloadRow), btn.dataset.fileField));
          });
          $$('[data-file-preview-row]', this.dom.stageBody).forEach(btn => {
            btn.addEventListener('click', () => this.previewRowFile(active, Number(btn.dataset.filePreviewRow), btn.dataset.fileField));
          });
        }

        async downloadRowFile(active, id, fieldId) {
          const { schema, error } = this.parseJSONForm(active);
          if (error || !schema) return;
          const rowIndex = JSONFormModel.findRowIndex(schema, id);
          const meta = rowIndex >= 0 ? schema.data[rowIndex]?.[fieldId] : null;
          if (!meta?.path) return;
          try {
            await fileAssets.download(meta);
            window.Logger?.log('FORM', 'success', `Downloaded file [${meta.name || fieldId}]`, { id, fieldId });
          } catch (err) {
            window.Logger?.log('FORM', 'error', 'File download failed', { id, fieldId, error: err?.message });
            alert('ไม่พบไฟล์หรือไม่สามารถดาวน์โหลดได้');
          }
        }

        async previewRowFile(active, id, fieldId) {
          const { schema, error } = this.parseJSONForm(active);
          if (error || !schema) return;
          const rowIndex = JSONFormModel.findRowIndex(schema, id);
          const meta = rowIndex >= 0 ? schema.data[rowIndex]?.[fieldId] : null;
          if (!meta?.path) return;
          const mimeType = String(meta.mimeType || '');
          if (!mimeType.startsWith('image/') && !mimeType.startsWith('video/')) return;
          try {
            const blob = await fileAssets.read(meta);
            if (!blob) throw new Error('FILE_NOT_FOUND');
            const url = URL.createObjectURL(blob);
            closeActiveModal();
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="row-edit-modal" role="dialog" aria-modal="true" aria-label="File preview"><div class="modal-header"><span style="font-weight:700;font-size:.82rem;color:#fff;">${escapeHTML(meta.name || 'Preview')}</span><button type="button" class="dock-btn modal-close-btn" id="btn-close-file-preview" data-modal-close aria-label="ปิดหน้าต่าง" title="ปิด">×</button></div><div style="padding:12px;min-height:0;overflow:auto;text-align:center;">${mimeType.startsWith('image/') ? `<img src="${url}" alt="${escapeHTML(meta.name || '')}" style="max-width:100%;max-height:70vh;object-fit:contain;">` : `<video src="${url}" controls style="max-width:100%;max-height:70vh;"></video>`}</div></div>`;
            document.body.appendChild(overlay);
            const close = () => { URL.revokeObjectURL(url); overlay.remove(); };
            $('#btn-close-file-preview', overlay)?.addEventListener('click', close);
          } catch (err) {
            window.Logger?.log('FORM', 'error', 'File preview failed', { id, fieldId, error: err?.message });
            alert('ไม่พบไฟล์หรือไม่สามารถเปิด Preview ได้');
          }
        }

        getRowEditorFieldHTML(field, value) {
          if (!field || field.type === 'autoIncrement' || field.id === 'id') return '';
          const id = escapeHTML(field.id || '');
          const label = escapeHTML(field.label || field.id || 'Field');
          const required = field.required && field.type !== 'checkbox' ? 'required' : '';
          const normalized = value ?? '';

          if (field.type === 'textarea') {
            return `
              <div class="json-form-field">
                <label>${label}${field.required ? ' *' : ''}</label>
                <textarea data-form-key="${id}" data-form-type="textarea" rows="${Math.max(2, Math.min(20, Number(field.rows) || 5))}" ${required}>${escapeHTML(normalized)}</textarea>
              </div>`;
          }

          if (field.type === 'select') {
            const options = Array.isArray(field.options) ? field.options : [];
            return `
              <div class="json-form-field">
                <label>${label}${field.required ? ' *' : ''}</label>
                <select data-form-key="${id}" data-form-type="select" ${required}>
                  ${options.map(option => {
                    const optionValue = String(option);
                    return `<option value="${escapeHTML(optionValue)}" ${String(normalized) === optionValue ? 'selected' : ''}>${escapeHTML(optionValue)}</option>`;
                  }).join('')}
                </select>
              </div>`;
          }

          if (field.type === 'checkbox') {
            return `
              <div class="json-form-field json-form-check">
                <label>${label}</label>
                <div class="json-form-checkbox-control">
                  <input data-form-key="${id}" data-form-type="checkbox" type="checkbox" ${value ? 'checked' : ''} ${required} />
                </div>
              </div>`;
          }

          if (field.type === 'file') {
            const accept = escapeHTML(field.accept || '*/*');
            const hasCurrent = Boolean(value?.path);
            return `
              <div class="json-form-field">
                <label>${label}${field.required ? ' *' : ''}</label>
                <div class="json-file-control">
                  <input data-form-key="${id}" data-form-type="file" type="file" accept="${accept}" ${field.required && !hasCurrent ? 'required' : ''} />
                  <span class="json-file-current">${hasCurrent ? `ปัจจุบัน: ${escapeHTML(value.name || 'file')}` : 'ยังไม่มีไฟล์'}</span>
                </div>
              </div>`;
          }

          if (JSONFormModel.isPasswordField(field)) {
            const hasCurrent = JSONFormModel.isPasswordRecord(value);
            return `
              <div class="json-form-field">
                <label>${label}${field.required ? ' *' : ''}</label>
                <div class="json-file-control">
                  <input data-form-key="${id}" data-form-type="input" type="password" value="" placeholder="${hasCurrent ? 'เว้นว่างเพื่อใช้รหัสผ่านเดิม' : 'กรอกรหัสผ่าน'}" autocomplete="new-password" ${field.required && !hasCurrent ? 'required' : ''} />
                  <span class="json-file-current">${hasCurrent ? 'ตั้งรหัสผ่านแล้ว · กรอกใหม่เมื่อต้องการเปลี่ยน' : 'ยังไม่มีรหัสผ่าน'}</span>
                </div>
              </div>`;
          }

          return `
            <div class="json-form-field">
              <label>${label}${field.required ? ' *' : ''}</label>
              <input data-form-key="${id}" data-form-type="input" type="${escapeHTML(field.inputType || 'text')}" value="${escapeHTML(normalized)}" ${required} />
            </div>`;
        }

        openRowEditor(active, id) {
          const { schema, error } = this.parseJSONForm(active);
          if (error || !schema) return;
          const rowIndex = JSONFormModel.findRowIndex(schema, id);
          if (rowIndex < 0) return;
          const row = schema.data[rowIndex];

          closeActiveModal();
          const overlay = document.createElement('div');
          overlay.className = 'modal-overlay';
          overlay.innerHTML = `
            <div class="row-edit-modal" role="dialog" aria-modal="true" aria-label="แก้ไขข้อมูล">
              <div class="modal-header">
                <span style="font-weight:700; font-size:.82rem; color:#fff;">แก้ไข Row · id=${escapeHTML(id)}</span>
                <button type="button" class="dock-btn modal-close-btn" id="btn-close-row-editor" data-modal-close aria-label="ปิดหน้าต่าง" title="ปิด">×</button>
              </div>
              <form id="row-edit-form" style="display:flex; flex-direction:column; min-height:0; flex:1;">
                <div class="row-edit-body">
                  <div class="json-form-static-row">
                    <span class="json-form-static-key">Primary Key</span>
                    <span class="json-form-static-val">id=${escapeHTML(id)}</span>
                  </div>
                  ${(schema.fields || []).map(field => this.getRowEditorFieldHTML(field, row?.[field.id])).join('')}
                </div>
                <div class="modal-footer" style="justify-content:flex-end;">
                  <div style="display:flex; gap:6px;">
                    <button type="button" class="btn" id="btn-cancel-row-edit">ยกเลิก</button>
                    <button type="submit" class="btn primary">💾 บันทึกการแก้ไข</button>
                  </div>
                </div>
              </form>
            </div>`;
          document.body.appendChild(overlay);

          const close = () => overlay.remove();
          $('#btn-close-row-editor', overlay)?.addEventListener('click', close);
          $('#btn-cancel-row-edit', overlay)?.addEventListener('click', close);

          $('#row-edit-form', overlay)?.addEventListener('submit', async e => {
            e.preventDefault();
            const form = e.currentTarget;
            if (!form.reportValidity()) return;

            const { schema: latest, error: latestError } = this.parseJSONForm(active);
            if (latestError || !latest) return;
            const index = JSONFormModel.findRowIndex(latest, id);
            if (index < 0) return;

            let collected;
            try {
              collected = await this.collectJSONFormValues(form, latest, { active, recordId: id, previousRow: latest.data[index] });
            } catch (uploadError) {
              window.Logger?.log('FORM', 'error', `Form value processing failed [${active.filename}]`, { id, name: uploadError?.name, error: uploadError?.message, opfsError: uploadError?.opfsError?.name || null, fallbackError: uploadError?.fallbackError?.name || null });
              alert('ประมวลผลข้อมูลไม่สำเร็จ');
              return;
            }
            const previousFiles = fileAssets.getFileValues(latest.data[index], latest.fields);
            latest.data[index] = { id, ...collected.values };
            const saved = await this.persistJSONForm(active, latest, 'row-update');
            if (!saved) {
              await fileAssets.removeMany(collected.uploaded, 'row-update-rollback');
              return;
            }
            const newPaths = new Set(fileAssets.getFileValues(latest.data[index], latest.fields).map(meta => meta.path));
            await fileAssets.removeMany(previousFiles.filter(meta => !newPaths.has(meta.path)), 'row-file-replace');

            close();
            window.Logger?.log('FORM', 'success', `Updated record [${active.filename}] id=${id}`, { id });
            this.renderJSONFormStage(active, true);
          });
        }

        async deleteRow(active, id) {
          const { schema, error } = this.parseJSONForm(active);
          if (error || !schema) return;
          const rowIndex = JSONFormModel.findRowIndex(schema, id);
          if (rowIndex < 0) return;
          if (!confirm(`ยืนยันการลบ record id=${id} หรือไม่?`)) return;

          const removedRow = schema.data[rowIndex];
          const removedFiles = fileAssets.getFileValues(removedRow, schema.fields);
          schema.data.splice(rowIndex, 1);
          const saved = await this.persistJSONForm(active, schema, 'row-delete');
          if (!saved) return;
          await fileAssets.removeMany(removedFiles, 'row-delete');

          window.Logger?.log('FORM', 'success', `Deleted record [${active.filename}] id=${id}`, { id });
          this.renderJSONFormStage(active, true);
        }

        getJSONSourceHTML(active) {
          const { schema, error } = this.parseJSONForm(active);
          if (error || !schema) {
            return `<div class="json-invalid">JSON ไม่ถูกต้อง: ${escapeHTML(error?.message || 'Unknown error')}</div>`;
          }

          const fieldsJSON = JSON.stringify({ fields: schema.fields || [] }, null, 2);
          return `
            <div class="form-group" style="flex:1; min-height:0; display:flex;">
              <div class="json-output-toolbar">
                <div class="json-output-toolbar-left">
                  <label>FIELDS JSON</label>
                  <span id="line-indicator" class="json-page-info">Ln ${fieldsJSON.split('\n').length}, Col 1 · Synced</span>
                </div>
                <div class="json-output-toolbar-right">
                  <button class="btn" id="btn-copy-json-fields">📋 Copy JSON</button>
                  <button class="btn primary" id="btn-apply-json-fields" disabled>✓ Apply Fields</button>
                </div>
              </div>
              <textarea id="json-source-input" placeholder='{"fields": []}' spellcheck="false">${escapeHTML(fieldsJSON)}</textarea>
            </div>
          `;
        }

        bindJSONSourceEditor(active) {
          const input = $('#json-source-input', this.dom.stageBody);
          const lineIndicator = $('#line-indicator', this.dom.stageBody);
          const applyBtn = $('#btn-apply-json-fields', this.dom.stageBody);
          if (!input || !applyBtn) return;

          let appliedValue = input.value;
          const current = this.parseJSONForm(active);
          if (current.error || !current.schema) return;
          const validationScreen = current.schema.screen || {};

          const parseDraft = () => {
            const parsed = JSON.parse(input.value || '{}');
            const fields = Array.isArray(parsed) ? parsed : parsed.fields;
            if (!Array.isArray(fields)) throw new Error('ต้องมี fields[]');

            const validation = JSONFormModel.parse(JSON.stringify({
              screen: validationScreen,
              fields,
              data: []
            }));
            if (validation.error || !validation.schema) {
              throw validation.error || new Error('Fields schema ไม่ถูกต้อง');
            }
            return fields;
          };

          const refreshDraftState = () => {
            if (!input.isConnected || this.isComposing) return;
            const lines = input.value.split('\n').length;
            if (input.value === appliedValue) {
              applyBtn.disabled = true;
              if (lineIndicator) lineIndicator.textContent = `Ln ${lines}, Col 1 · Synced`;
              return;
            }

            try {
              parseDraft();
              applyBtn.disabled = false;
              if (lineIndicator) lineIndicator.textContent = `Ln ${lines}, Col 1 · Ready to apply`;
            } catch (error) {
              applyBtn.disabled = true;
              if (lineIndicator) lineIndicator.textContent = `JSON ไม่ถูกต้อง · ${error?.message || 'Invalid fields'}`;
            }
          };

          input.addEventListener('compositionstart', () => { this.isComposing = true; });
          input.addEventListener('compositionend', () => {
            this.isComposing = false;
            refreshDraftState();
          });
          input.addEventListener('input', refreshDraftState);

          applyBtn.addEventListener('click', async () => {
            let fields;
            try {
              fields = parseDraft();
            } catch (error) {
              refreshDraftState();
              return;
            }

            applyBtn.disabled = true;
            applyBtn.textContent = 'Applying...';
            try {
              const applied = await this.applyJSONFieldsDefinition(active, fields);
              if (!applied || !input.isConnected) return;

              const latest = this.parseJSONForm(active);
              if (latest.error || !latest.schema) throw latest.error || new Error('Schema หลังบันทึกไม่ถูกต้อง');
              appliedValue = JSON.stringify({ fields: latest.schema.fields || [] }, null, 2);
              input.value = appliedValue;
              if (lineIndicator) lineIndicator.textContent = `Ln ${input.value.split('\n').length}, Col 1 · Applied`;
            } catch (error) {
              if (lineIndicator && input.isConnected) {
                lineIndicator.textContent = `Apply ไม่สำเร็จ · ${error?.message || 'Invalid fields'}`;
              }
            } finally {
              if (applyBtn.isConnected) {
                applyBtn.textContent = '✓ Apply Fields';
                refreshDraftState();
              }
            }
          });

          $('#btn-copy-json-fields', this.dom.stageBody)?.addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            try {
              await navigator.clipboard.writeText(input.value || '');
              btn.textContent = '✓ Copied';
              setTimeout(() => { if (btn?.isConnected) btn.textContent = '📋 Copy JSON'; }, 1200);
              window.Logger?.log('FORM', 'success', `Copied fields JSON [${active.filename}]`);
            } catch (_) {}
          });
        }

        async applyJSONFieldsDefinition(active, fields) {
          if (!active || store.getActive()?.id !== active.id) return false;
          const { schema, error } = this.parseJSONForm(active);
          if (error || !schema) return false;

          let prepared;
          try {
            prepared = JSONFormModel.prepareFieldsUpdate(schema, fields);
          } catch (validationError) {
            window.Logger?.log('FORM', 'warn', `Rejected fields JSON [${active.filename}]`, {
              error: validationError?.message || String(validationError || '')
            });
            throw validationError;
          }

          this.isEditingProperties = true;
          let saved = false;
          try {
            saved = await this.persistJSONForm(active, prepared.schema, 'fields-json-edit');
          } finally {
            this.isEditingProperties = false;
          }
          if (!saved) return false;

          await fileAssets.removeMany(prepared.retiredFiles, 'fields-json-edit');
          const currentIndex = this.selectedFormFields.get(active.id) ?? 0;
          this.selectedFormFields.set(active.id, Math.max(0, Math.min(currentIndex, prepared.schema.fields.length - 1)));
          this.renderJSONFormProperties(active);
          window.Logger?.log('FORM', 'success', `Updated fields schema [${active.filename}]`, {
            fields: prepared.schema.fields.length,
            retiredFiles: prepared.retiredFiles.length
          });
          return true;
        }

        async updateJSONFormSchema(mutator, reason = 'field-edit', syncImmediate = false) {
          const active = store.getActive();
          if (!active || active.kind !== 'json-form') return false;
          const { schema, error } = this.parseJSONForm(active);
          if (error || !schema) return false;

          try {
            mutator(schema);
          } catch (mutationError) {
            window.Logger?.log('FORM', 'warn', `Schema update rejected [${active.filename}]`, { error: mutationError?.message });
            return false;
          }

          const validated = JSONFormModel.parse(JSON.stringify(schema));
          if (validated.error || !validated.schema) {
            window.Logger?.log('FORM', 'warn', `Schema update rejected [${active.filename}]`, {
              reason,
              error: validated.error?.message || 'Invalid schema'
            });
            alert(validated.error?.message || 'Schema ไม่ถูกต้อง');
            this.renderJSONFormProperties(active);
            return false;
          }

          const nextSchema = validated.schema;
          const nextText = JSON.stringify(nextSchema, null, 2);
          this.isEditingProperties = true;
          let saved = true;
          try {
            if (syncImmediate) {
              saved = await this.persistJSONForm(active, nextSchema, reason);
            } else {
              await store.updateActive({ description: nextText }, false, reason);
            }
          } finally {
            this.isEditingProperties = false;
          }
          if (!saved) {
            this.renderJSONFormProperties(active);
            return false;
          }

          const source = $('#json-source-input', this.dom.stageBody);
          if (source && source !== document.activeElement) {
            const fieldsText = JSON.stringify({ fields: nextSchema.fields || [] }, null, 2);
            source.value = fieldsText;
            const indicator = $('#line-indicator', this.dom.stageBody);
            if (indicator) indicator.textContent = `Ln ${fieldsText.split('\n').length}, Col 1`;
          }
          return true;
        }

        renderProperties() {
          const active = store.getActive();
          if (!active) {
            this.dom.propContent.innerHTML = '<div style="color:var(--text-muted); font-size:0.72rem; text-align:center; padding:16px 0;">ไม่มีข้อมูล</div>';
            return;
          }

          if (active.kind === 'json-form' && (this.stageModes.get(active.id) || 'screen') === 'json') {
            this.renderJSONFormProperties(active);
            return;
          }

          const text = active.description || '';
          this.dom.propContent.innerHTML = `
            <div class="prop-row"><span class="prop-key">ชนิด</span><span class="prop-val">${active.kind === 'json-form' ? 'JSON Form' : 'Markdown'}</span></div>
            <div class="prop-row"><span class="prop-key">หมวดหมู่</span><span class="prop-val">${escapeHTML(active.category)}</span></div>
            <div class="prop-row"><span class="prop-key">จำนวนตัวอักษรจริง</span><span class="prop-val">${getVisualLength(text)}</span></div>
            <div class="prop-row"><span class="prop-key">บรรทัด</span><span class="prop-val">${text.split('\n').length}</span></div>
            <div class="prop-row"><span class="prop-key">แก้ไขล่าสุด</span><span class="prop-val">${new Date(active.updatedAt || Date.now()).toLocaleTimeString('th-TH')}</span></div>
            <div class="prop-editor">
              <div class="prop-control-row">
                <label>หมวดหมู่</label>
                <input type="text" id="prop-cat-input" value="${escapeHTML(active.category)}" />
              </div>
            </div>
          `;

          $('#prop-cat-input', this.dom.propContent)?.addEventListener('input', (e) => {
            store.updateActive({ category: e.target.value }, true, 'category-edit');
            const label = $('#stage-cat-label', this.dom.stageBody);
            if (label) label.textContent = e.target.value;
          });
        }

        renderJSONFormProperties(active) {
          const { schema, error } = this.parseJSONForm(active);
          if (error || !schema) {
            this.dom.propContent.innerHTML = `
              <div class="prop-row"><span class="prop-key">ชนิด</span><span class="prop-val">JSON Form</span></div>
              <div class="json-invalid" style="margin-top:10px;">JSON ไม่ถูกต้อง<br>${escapeHTML(error?.message || '')}</div>
            `;
            return;
          }

          const fields = schema.fields || [];
          let selected = this.selectedFormFields.get(active.id) ?? 0;
          if (selected >= fields.length) selected = Math.max(0, fields.length - 1);
          this.selectedFormFields.set(active.id, selected);
          const field = fields[selected] || null;

          this.dom.propContent.innerHTML = `
            <div class="prop-row"><span class="prop-key">JSON Status</span><span class="prop-val" style="color:var(--success);">VALID</span></div>
            <div class="prop-row"><span class="prop-key">Fields</span><span class="prop-val">${fields.length}</span></div>

            <div class="prop-editor">
              <div class="prop-control-row">
                <label>ชื่อหน้าจอ</label>
                <input type="text" id="prop-screen-title" value="${escapeHTML(schema.screen?.title || '')}" />
              </div>

              <div class="prop-control-row">
                <label>คำอธิบาย</label>
                <input type="text" id="prop-screen-desc" value="${escapeHTML(schema.screen?.description || '')}" />
              </div>

              <div class="prop-control-row">
                <label>ปุ่มบันทึก</label>
                <input type="text" id="prop-submit-label" value="${escapeHTML(schema.screen?.submitLabel || '')}" />
              </div>

              <div class="prop-section-title">Data</div>
              <div class="prop-row"><span class="prop-key">Primary Key</span><span class="prop-val">id</span></div>
              <div class="prop-row"><span class="prop-key">Auto Increment</span><span class="prop-val">ON</span></div>
              <div class="prop-row"><span class="prop-key">Rows</span><span class="prop-val">${schema.data.length}</span></div>

              <div class="prop-section-title">เพิ่ม Component</div>
              <div class="prop-actions prop-actions-wrap">
                <button class="btn" id="prop-add-text">＋ Text</button>
                <button class="btn" id="prop-add-number">＋ Number</button>
                <button class="btn" id="prop-add-date">＋ Date</button>
                <button class="btn" id="prop-add-password">＋ Password</button>
                <button class="btn" id="prop-add-textarea">＋ Textarea</button>
                <button class="btn" id="prop-add-select">＋ Select</button>
                <button class="btn" id="prop-add-checkbox">＋ Checkbox</button>
                <button class="btn" id="prop-add-file">＋ File</button>
              </div>

              <div class="prop-section-title">Fields</div>
              <div class="prop-field-list">
                ${fields.map((f, i) => {
                  const isPrimaryKey = f.type === 'autoIncrement' || f.id === 'id';
                  return `
                    <div class="prop-field-row">
